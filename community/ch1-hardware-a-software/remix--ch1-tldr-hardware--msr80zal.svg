<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Telefon má tělo i myšlenky</title><desc id="desc">Diagram rozlišuje fyzické části telefonu, tedy hardware, a programy a data, tedy software.</desc><rect x="10" y="10" width="780" height="400" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="1.5"/><text x="32" y="44" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1E1B4B">Telefon má tělo i myšlenky</text><rect x="28" y="76" width="210" height="280" rx="14" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="2"/><text x="48" y="104" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1E1B4B">HARDWARE</text><rect x="48" y="116" width="142" height="27" rx="13.5" fill="#E0F2FE"/><text x="119" y="134" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#0EA5E9">na co si sáhneš</text><rect x="48" y="158" width="24" height="32" rx="4" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2"/><text x="86" y="172" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1E1B4B">Displej</text><text x="86" y="187" font-family="Arial, sans-serif" font-size="11" fill="#6B7280">sklo a dotyková vrstva</text><circle cx="60" cy="215" r="9" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2"/><circle cx="60" cy="215" r="3" fill="#0EA5E9"/><text x="86" y="211" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1E1B4B">Fotoaparát</text><text x="86" y="226" font-family="Arial, sans-serif" font-size="11" fill="#6B7280">čočka a snímač</text><rect x="49" y="246" width="22" height="29" rx="3" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2"/><rect x="56" y="242" width="8" height="4" rx="1" fill="#0EA5E9"/><text x="86" y="255" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1E1B4B">Baterie</text><text x="86" y="270" font-family="Arial, sans-serif" font-size="11" fill="#6B7280">fyzický zdroj energie</text><line x1="51" y1="305" x2="69" y2="305" stroke="#0EA5E9" stroke-width="3" stroke-linecap="round"/><line x1="60" y1="296" x2="60" y2="314" stroke="#0EA5E9" stroke-width="3" stroke-linecap="round"/><text x="86" y="301" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1E1B4B">Tlačítka a porty</text><text x="86" y="316" font-family="Arial, sans-serif" font-size="11" fill="#6B7280">ovládání a připojení</text><text x="261" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6B7280">část</text><text x="261" y="191" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6B7280">telefonu</text><line x1="242" y1="211" x2="279" y2="211" stroke="#0EA5E9" stroke-width="2.5" stroke-linecap="round"/><polygon points="279,211 270,205 270,217" fill="#0EA5E9"/><rect x="285" y="76" width="230" height="280" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/><text x="400" y="103" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1E1B4B">JEDNO ZAŘÍZENÍ</text><rect x="337" y="116" width="126" height="191" rx="18" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2.5"/><circle cx="400" cy="126" r="4" fill="#0EA5E9"/><text x="417" y="130" font-family="Arial, sans-serif" font-size="11" fill="#6B7280">kamera</text><rect x="348" y="137" width="104" height="139" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><rect x="357" y="148" width="86" height="30" rx="7" fill="#FFFFFF"/><circle cx="372" cy="163" r="7" fill="#E0F2FE"/><text x="386" y="167" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#1E1B4B">Mapy</text><rect x="357" y="185" width="86" height="30" rx="7" fill="#FFFFFF"/><circle cx="372" cy="200" r="7" fill="#D1FAE5"/><text x="386" y="204" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#1E1B4B">Platby</text><rect x="357" y="222" width="86" height="30" rx="7" fill="#FFFFFF"/><circle cx="372" cy="237" r="7" fill="#FEF3C7"/><text x="386" y="241" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#1E1B4B">Hovory</text><text x="400" y="269" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#7C3AED">operační systém</text><line x1="389" y1="291" x2="411" y2="291" stroke="#0EA5E9" stroke-width="2.5" stroke-linecap="round"/><rect x="298" y="319" width="96" height="25" rx="12.5" fill="#E0F2FE"/><text x="346" y="336" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#0EA5E9">tělo: hardware</text><rect x="400" y="319" width="102" height="25" rx="12.5" fill="#EDE9FE"/><text x="451" y="336" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#7C3AED">obsah: software</text><text x="539" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6B7280">část</text><text x="539" y="191" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6B7280">telefonu</text><line x1="558" y1="211" x2="521" y2="211" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round"/><polygon points="521,211 530,205 530,217" fill="#7C3AED"/><rect x="562" y="76" width="210" height="280" rx="14" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/><text x="582" y="104" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1E1B4B">SOFTWARE</text><rect x="582" y="116" width="142" height="27" rx="13.5" fill="#EDE9FE"/><text x="653" y="134" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#7C3AED">co v něm běží</text><rect x="582" y="158" width="25" height="25" rx="6" fill="#EDE9FE"/><circle cx="594.5" cy="170.5" r="6" fill="none" stroke="#7C3AED" stroke-width="2"/><text x="620" y="168" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1E1B4B">Operační systém</text><text x="620" y="183" font-family="Arial, sans-serif" font-size="11" fill="#6B7280">řídí chod telefonu</text><rect x="582" y="204" width="25" height="25" rx="6" fill="#D1FAE5"/><path d="M589 216 L593 220 L601 211" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="620" y="214" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1E1B4B">Aplikace</text><text x="620" y="229" font-family="Arial, sans-serif" font-size="11" fill="#6B7280">mapy, platby, hovory</text><rect x="582" y="250" width="25" height="25" rx="6" fill="#FEF3C7"/><circle cx="594.5" cy="262.5" r="6" fill="none" stroke="#D97706" stroke-width="2"/><line x1="594.5" y1="262.5" x2="594.5" y2="258" stroke="#D97706" stroke-width="2" stroke-linecap="round"/><line x1="594.5" y1="262.5" x2="599" y2="265" stroke="#D97706" stroke-width="2" stroke-linecap="round"/><text x="620" y="260" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1E1B4B">Funkce</text><text x="620" y="275" font-family="Arial, sans-serif" font-size="11" fill="#6B7280">co telefon umí</text><rect x="582" y="296" width="25" height="25" rx="6" fill="#EDE9FE"/><path d="M588 302 H601 V316 H588 Z M591 306 H598 M591 310 H598" fill="none" stroke="#7C3AED" stroke-width="2" stroke-linecap="round"/><text x="620" y="306" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1E1B4B">Data a nastavení</text><text x="620" y="321" font-family="Arial, sans-serif" font-size="11" fill="#6B7280">tvůj digitální obsah</text><text x="400" y="394" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#6B7280">Při výběru se ptej: Co s telefonem budu dělat — a jaké tělo i programy k tomu potřebuji?</text></svg>