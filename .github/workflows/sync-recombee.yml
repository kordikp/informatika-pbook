name: Sync Content to Recombee

# After every successful production deploy, the deployment syncs its own catalog to Recombee
# (api/sync-recombee.js reads content/book.json and the bundle from the site, so it imports
# exactly what readers see). Needs the repository secret SYNC_SECRET (= SYNC_SECRET in Vercel env);
# without it the job is skipped (e.g. in a mirror of this repo).
on:
  deployment_status:
  workflow_dispatch: # manual trigger from GitHub UI

jobs:
  sync:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       startsWith(github.event.deployment.environment, 'Production'))
    runs-on: ubuntu-latest
    steps:
      - name: Sync items to Recombee
        env:
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
          SITE: https://informatika-pbook.vercel.app
        run: |
          if [ -z "$SYNC_SECRET" ]; then echo "SYNC_SECRET not set, skipping"; exit 0; fi
          jq -n --arg s "$SYNC_SECRET" '{secret: $s}' > body.json
          curl -sS --fail-with-body --max-time 300 -X POST "$SITE/api/sync-recombee" \
            -H 'Content-Type: application/json' --data @body.json | head -c 2000
          rm -f body.json
