<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" role="img" aria-label="Vozítko se dvěma senzory nad černou čárou">
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#7C3AED"/></marker><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#10B981"/></marker></defs>
  <rect x="1" y="1" width="518" height="258" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>
  <g font-family="system-ui, sans-serif">
  <text x="18" y="26" font-size="17" font-weight="700" fill="#1E1B4B">Vozítko, které sleduje čáru</text>
  <text x="18" y="44" font-size="11" fill="#6B7280">Dva světelné senzory pod vozítkem (žluté kroužky) hlásí bílou, nebo černou.</text>
  <rect x="26" y="58" width="144" height="130" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <path d="M98 186 L98 60" fill="none" stroke="#111827" stroke-width="14" stroke-linecap="butt"/>
  <rect x="76" y="110" width="44" height="58" rx="9" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2" opacity=".92"/>
  <rect x="69" y="138" width="7" height="20" rx="2" fill="#1E1B4B"/><rect x="120" y="138" width="7" height="20" rx="2" fill="#1E1B4B"/>
  <circle cx="85" cy="118" r="5.5" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2.5"/>
  <circle cx="111" cy="118" r="5.5" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2.5"/>
  <text x="98" y="208" font-size="12" font-weight="700" fill="#1E1B4B" text-anchor="middle">jeď rovně</text>
  <text x="98" y="224" font-size="10" fill="#6B7280" text-anchor="middle">oba vidí bílou</text>
  <rect x="188" y="58" width="144" height="130" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <path d="M260 186 L260 140 Q260 116 246 100 L220 62" fill="none" stroke="#111827" stroke-width="14" stroke-linecap="butt"/>
  <rect x="238" y="110" width="44" height="58" rx="9" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2" opacity=".92"/>
  <rect x="231" y="138" width="7" height="20" rx="2" fill="#1E1B4B"/><rect x="282" y="138" width="7" height="20" rx="2" fill="#1E1B4B"/>
  <circle cx="247" cy="118" r="5.5" fill="#111827" stroke="#F59E0B" stroke-width="2.5"/>
  <circle cx="273" cy="118" r="5.5" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2.5"/>
  <text x="260" y="208" font-size="12" font-weight="700" fill="#1E1B4B" text-anchor="middle">zatoč vlevo</text>
  <text x="260" y="224" font-size="10" fill="#6B7280" text-anchor="middle">levý vidí černou</text>
  <rect x="350" y="58" width="144" height="130" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <path d="M422 186 L422 140 Q422 116 436 100 L462 62" fill="none" stroke="#111827" stroke-width="14" stroke-linecap="butt"/>
  <rect x="400" y="110" width="44" height="58" rx="9" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2" opacity=".92"/>
  <rect x="393" y="138" width="7" height="20" rx="2" fill="#1E1B4B"/><rect x="444" y="138" width="7" height="20" rx="2" fill="#1E1B4B"/>
  <circle cx="409" cy="118" r="5.5" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2.5"/>
  <circle cx="435" cy="118" r="5.5" fill="#111827" stroke="#F59E0B" stroke-width="2.5"/>
  <text x="422" y="208" font-size="12" font-weight="700" fill="#1E1B4B" text-anchor="middle">zatoč vpravo</text>
  <text x="422" y="224" font-size="10" fill="#6B7280" text-anchor="middle">pravý vidí černou</text>
  <text x="260" y="248" font-size="11" font-weight="600" fill="#7C3AED" text-anchor="middle">Čti senzory → rozhodni → ovládni motory. A pořád dokola.</text>

  </g>
