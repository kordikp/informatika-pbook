<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" role="img" aria-label="Jak doporučovač rozhoduje o dosahu videa">
  <defs><marker id="a" viewBox="0 0 10 10" markerWidth="4.5" markerHeight="4.5" refX="7" refY="5" orient="auto"><path d="M0 1 L10 5 L0 9 L2 5 Z" fill="#7C3AED"/></marker><marker id="g" viewBox="0 0 10 10" markerWidth="4.5" markerHeight="4.5" refX="7" refY="5" orient="auto"><path d="M0 1 L10 5 L0 9 L2 5 Z" fill="#10B981"/></marker><marker id="r" viewBox="0 0 10 10" markerWidth="4.5" markerHeight="4.5" refX="7" refY="5" orient="auto"><path d="M0 1 L10 5 L0 9 L2 5 Z" fill="#EF4444"/></marker><marker id="s" viewBox="0 0 10 10" markerWidth="4.5" markerHeight="4.5" refX="7" refY="5" orient="auto"><path d="M0 1 L10 5 L0 9 L2 5 Z" fill="#9CA3AF"/></marker></defs>
  <rect x="1" y="1" width="518" height="258" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>
  <g font-family="system-ui, sans-serif">
  <text x="18" y="26" font-size="17" font-weight="700" fill="#1E1B4B">How a video gets reach</text>
  <text x="18" y="44" font-size="11" fill="#6B7280">Each round is a test on a small group. Depending on the signals, the video goes on or stops.</text>
  <rect x="18" y="108" width="84" height="44" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="60" y="127" font-size="10" font-weight="700" fill="#1E1B4B" text-anchor="middle">you upload</text>
  <text x="60" y="141" font-size="10" font-weight="700" fill="#1E1B4B" text-anchor="middle">a video</text>
  <line x1="106" y1="130" x2="118" y2="130" stroke="#7C3AED" stroke-width="2" marker-end="url(#a)"/>
  <rect x="120" y="115.0" width="64" height="30" rx="8" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2"/>
  <text x="152.0" y="126" font-size="10" font-weight="700" fill="#1E1B4B" text-anchor="middle">round 1</text>
  <text x="152.0" y="140" font-size="9" fill="#1E1B4B" text-anchor="middle">300 people</text>
  <line x1="196" y1="130" x2="208" y2="130" stroke="#7C3AED" stroke-width="2" marker-end="url(#a)"/>
  <rect x="210" y="106.0" width="104" height="48" rx="8" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2"/>
  <text x="262.0" y="126" font-size="10" font-weight="700" fill="#1E1B4B" text-anchor="middle">round 2</text>
  <text x="262.0" y="140" font-size="9" fill="#1E1B4B" text-anchor="middle">3,000 people</text>
  <line x1="326" y1="130" x2="338" y2="130" stroke="#7C3AED" stroke-width="2" marker-end="url(#a)"/>
  <rect x="340" y="97.0" width="150" height="66" rx="8" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2"/>
  <text x="415.0" y="126" font-size="10" font-weight="700" fill="#1E1B4B" text-anchor="middle">round 3</text>
  <text x="415.0" y="140" font-size="9" fill="#1E1B4B" text-anchor="middle">30,000 people</text>
  <rect x="120" y="184" width="376" height="54" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="132" y="202" font-size="10" font-weight="700" fill="#1E1B4B">signals after each round:</text>
  <text x="132" y="218" font-size="10" font-weight="600" fill="#10B981">✓ watched to the end · replayed · shared</text>
  <text x="132" y="232" font-size="10" font-weight="600" fill="#EF4444">✗ skipped after 2 s · Not interested</text>
  <text x="400" y="216" font-size="10" font-weight="600" fill="#1E1B4B" text-anchor="middle">good → next round</text>
  <text x="400" y="230" font-size="10" fill="#6B7280" text-anchor="middle">weak → the end</text>

  </g>
</svg>
