<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" font-family="system-ui,sans-serif" role="img" aria-label="Komiks: Vibecoding — appka za pět minut a iluze, že umím programovat">
  <rect width="800" height="640" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#1E1B4B">Umím programovat! (Umím klikat na Odešli.)</text>

  <!-- P1: appka za pět minut -->
  <rect x="14" y="56" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="40" y="70" width="250" height="56" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <path d="M84 126 L76 148 L110 126 Z" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="165" y="92" text-anchor="middle" font-size="13" fill="#1E1B4B">Appka za pět minut!</text>
  <text x="165" y="112" text-anchor="middle" font-size="13" fill="#1E1B4B">Já umím programovat!</text>
  <circle cx="80" cy="184" r="22" fill="#FEF3C7"/>
  <text x="80" y="192" text-anchor="middle" font-size="22">🤩</text>
  <path d="M66 214 Q80 206 94 214 L98 260 L62 260 Z" fill="#0EA5E9"/>
  <rect x="150" y="140" width="170" height="104" rx="8" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="2"/>
  <rect x="162" y="152" width="146" height="80" rx="4" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="235" y="174" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">KVÍZ O VESMÍRU</text>
  <text x="235" y="194" text-anchor="middle" font-size="11" fill="#1E1B4B">Otázka 1/10 ✓</text>
  <rect x="176" y="204" width="120" height="10" rx="5" fill="#E5E7EB"/>
  <rect x="176" y="204" width="80" height="10" rx="5" fill="#10B981"/>
  <text x="330" y="140" font-size="16">✨</text>
  <rect x="330" y="170" width="52" height="46" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="356" y="192" text-anchor="middle" font-size="18">🤖</text>
  <text x="356" y="210" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">AI</text>
  <text x="204" y="306" text-anchor="middle" font-size="12" fill="#6B7280">Pět minut, hotovo. Mozek si okamžitě připíše zásluhy.</text>

  <!-- P2: první náraz -->
  <rect x="406" y="56" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="422" y="66" width="200" height="54" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <path d="M470 120 L462 142 L494 120 Z" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="522" y="88" text-anchor="middle" font-size="12.5" fill="#1E1B4B">Kamarád klepnul</text>
  <text x="522" y="106" text-anchor="middle" font-size="12.5" fill="#1E1B4B">dvakrát rychle — a bum?!</text>
  <circle cx="470" cy="172" r="22" fill="#FEF3C7"/>
  <text x="470" y="180" text-anchor="middle" font-size="22">😨</text>
  <path d="M456 202 Q470 194 484 202 L488 248 L452 248 Z" fill="#0EA5E9"/>
  <rect x="560" y="130" width="190" height="118" rx="8" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="2"/>
  <rect x="572" y="142" width="166" height="94" rx="4" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="655" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#EF4444">CHYBA</text>
  <text x="655" y="192" text-anchor="middle" font-size="12" fill="#1E1B4B">skóre: -999</text>
  <text x="655" y="212" text-anchor="middle" font-size="11" fill="#1E1B4B">odpovědi zmizely</text>
  <text x="596" y="306" text-anchor="middle" font-size="12" fill="#6B7280">Vypadá to hotově ≠ je to hotové. Okrajový případ udeřil.</text>

  <!-- P3: smyčka oprav -->
  <rect x="14" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <circle cx="80" cy="450" r="22" fill="#FEF3C7"/>
  <text x="80" y="458" text-anchor="middle" font-size="22">🤯</text>
  <path d="M66 480 Q80 472 94 480 L98 508 L62 508 Z" fill="#0EA5E9"/>
  <text x="80" y="530" text-anchor="middle" font-size="11" fill="#6B7280">bez nápadu, co dál</text>
  <rect x="140" y="356" width="240" height="150" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="352" y="382" text-anchor="middle" font-size="16">🔁</text>
  <g font-size="11.5" fill="#1E1B4B">
    <text x="156" y="382">🤖 Opraveno!</text>
    <text x="156" y="404">🙁 Pořád rozbité.</text>
    <text x="156" y="426">🤖 Teď už opraveno!</text>
    <text x="156" y="448">🙁 Pořád rozbité…</text>
    <text x="156" y="470">🤖 Opraveno! (potřetí)</text>
  </g>
  <text x="156" y="492" font-size="11" fill="#6B7280">…za hodinu úplně totéž</text>
  <text x="204" y="586" text-anchor="middle" font-size="12" fill="#6B7280">AI opravuje dokola, chyba zůstává. Bez základů jsi uvízl.</text>

  <!-- P4: kamarádka se základy -->
  <rect x="406" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="422" y="344" width="236" height="58" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <path d="M480 402 L470 422 L506 402 Z" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="540" y="366" text-anchor="middle" font-size="12.5" fill="#1E1B4B">Tady: skóre se po chybě</text>
  <text x="540" y="384" text-anchor="middle" font-size="12.5" fill="#1E1B4B">nikdy nevynuluje. Vteřinku…</text>
  <rect x="666" y="356" width="112" height="26" rx="6" fill="#FEF3C7"/>
  <text x="722" y="373" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">oprava: 1 min</text>
  <circle cx="470" cy="444" r="22" fill="#D1FAE5"/>
  <text x="470" y="452" text-anchor="middle" font-size="22">👩‍💻</text>
  <path d="M456 474 Q470 466 484 474 L488 520 L452 520 Z" fill="#10B981"/>
  <circle cx="532" cy="482" r="18" fill="#FEF3C7"/>
  <text x="532" y="489" text-anchor="middle" font-size="18">😮</text>
  <path d="M520 504 Q532 497 544 504 L548 540 L516 540 Z" fill="#0EA5E9"/>
  <rect x="580" y="430" width="180" height="104" rx="8" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="2"/>
  <rect x="592" y="442" width="156" height="80" rx="4" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
  <text x="670" y="470" text-anchor="middle" font-size="12" font-weight="700" fill="#1E1B4B">KVÍZ FUNGUJE</text>
  <text x="670" y="492" text-anchor="middle" font-size="11.5" fill="#1E1B4B">skóre: 8/10 ✓</text>
  <text x="756" y="428" font-size="14">✨</text>
  <text x="670" y="552" text-anchor="middle" font-size="11" fill="#6B7280">rozdíl = základy</text>
  <text x="596" y="586" text-anchor="middle" font-size="12" fill="#6B7280">Kamarádka zná základy: přečte kód, najde místo, opraví.</text>

  <text x="400" y="626" text-anchor="middle" font-size="13" fill="#6B7280">Vibecoding je skvělý sluha: AI píše kód, ale řídit ho zvládne jen ten, kdo rozumí základům.</text>
</svg>
