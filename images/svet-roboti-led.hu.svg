  <text x="384" y="92" font-size="11" font-weight="600" fill="#1E1B4B">1 LED = 1 bit</text>
  <text x="384" y="112" font-size="11" font-weight="600" fill="#1E1B4B">25 LED = 25 bit</text>
  <text x="384" y="132" font-size="11" fill="#1E1B4B">≈ alig több 3 bájtnál</text>
  <text x="384" y="160" font-size="10" fill="#6B7280">0–9 fényerővel: 4 bit</text>
  <text x="260" y="248" font-size="11" fill="#6B7280" text-anchor="middle">Aki ismeri az átalakítási szabályt, a számokból ugyanazt a szívet rakja ki.</text>

