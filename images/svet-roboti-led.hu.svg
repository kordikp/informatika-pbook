  <g font-family="system-ui, sans-serif">
  <text x="18" y="26" font-size="17" font-weight="700" fill="#1E1B4B">Szív 25 számból</text>
  <text x="18" y="44" font-size="11" fill="#6B7280">A micro:bit kijelzőjén 5 × 5 LED van. Világít = 1, nem világít = 0.</text>
