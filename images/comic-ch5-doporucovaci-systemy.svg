  <g>
    <rect x="531" y="209" width="56" height="8" rx="4" fill="#EDE9FE" stroke="#7C3AED"/>
    <path d="M545 184 L570 184 L567 208 L548 208 Z" fill="#FEF3C7" stroke="#D97706"/>
    <rect x="617" y="209" width="56" height="8" rx="4" fill="#E0F2FE" stroke="#0EA5E9"/>
    <circle cx="645" cy="197" r="10" fill="#D1FAE5" stroke="#10B981"/>
  </g>
  <line x1="438" y1="232" x2="754" y2="232" stroke="#E5E7EB" stroke-width="4" stroke-linecap="round"/>
  <text x="596" y="306" font-size="12" fill="#6B7280" text-anchor="middle">Jiná historie, jinak naplněný tác.</text>

  <!-- Panel 3 -->
  <g>
    <rect x="31" y="352" width="181" height="52" rx="9" fill="#D1FAE5" stroke="#10B981"/>
    <text x="44" y="373" font-size="12.5" fill="#1E1B4B">
      <tspan x="44" y="373">Chipsaři berou colu.</tspan>
      <tspan x="44" y="390">Jablkáři zase müsli.</tspan>
    </text>
  </g>
  <g>
    <rect x="223" y="360" width="148" height="36" rx="9" fill="#E0F2FE" stroke="#0EA5E9"/>
    <text x="297" y="382" font-size="12.5" fill="#1E1B4B" text-anchor="middle">Máme chuťové sousedy?</text>
  </g>
  <g stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round" fill="none">
    <circle cx="90" cy="451" r="10" fill="#7C3AED" stroke="none"/>
    <path d="M90 462 L90 505 M90 474 L121 491 M90 504 L77 530 M90 504 L104 530"/>
  </g>
  <g stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round" fill="none">
    <circle cx="307" cy="451" r="10" fill="#0EA5E9" stroke="none"/>
    <path d="M307 462 L307 505 M307 474 L278 491 M307 504 L294 530 M307 504 L321 530"/>
  </g>
  <g stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round" fill="none">
    <circle cx="199" cy="439" r="10" fill="#10B981" stroke="none"/>
    <path d="M199 450 L199 496 M199 463 L164 490 M199 463 L237 490"/>
  </g>
  <g>
    <rect x="123" y="482" width="24" height="39" rx="4" fill="#FEE2E2" stroke="#EF4444"/>
    <path d="M129 482 L125 470" fill="none" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="247" y="484" width="42" height="31" rx="5" fill="#FEF3C7" stroke="#D97706"/>
    <circle cx="268" cy="481" r="4" fill="#D97706"/>
  </g>
  <line x1="45" y1="515" x2="350" y2="515" stroke="#E5E7EB" stroke-width="4" stroke-linecap="round"/>
  <text x="204" y="586" font-size="12" fill="#6B7280" text-anchor="middle">Podobné chutě vytvářejí tvoje „vkusové sousedy“.</text>

  <!-- Panel 4 -->
  <g>
    <rect x="423" y="352" width="177" height="52" rx="9" fill="#D1FAE5" stroke="#10B981"/>
    <text x="436" y="373" font-size="12.5" fill="#1E1B4B">
      <tspan x="436" y="373">Výživné? To neřeším.</tspan>
      <tspan x="436" y="390">Hlavně že tu sedíte.</tspan>
    </text>
  </g>
  <g>
    <rect x="616" y="360" width="145" height="36" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="688" y="382" font-size="12.5" fill="#1E1B4B" text-anchor="middle">Ještě poslední sousto…</text>
  </g>
  <g stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round" fill="none">
    <circle cx="510" cy="463" r="10" fill="#7C3AED" stroke="none"/>
    <path d="M510 474 L510 513 M510 486 L539 496 M510 512 L493 530"/>
  </g>
  <g stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round" fill="none">
    <circle cx="686" cy="463" r="10" fill="#0EA5E9" stroke="none"/>
    <path d="M686 474 L686 513 M686 486 L657 496 M686 512 L703 530"/>
  </g>
  <g stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round" fill="none">
    <circle cx="599" cy="430" r="10" fill="#10B981" stroke="none"/>
    <path d="M599 441 L599 487 M599 454 L579 472 M599 454 L619 472"/>
  </g>
  <g>
    <line x1="455" y1="510" x2="739" y2="510" stroke="#E5E7EB" stroke-width="4" stroke-linecap="round"/>
    <path d="M535 486 L558 486 L555 509 L538 509 Z" fill="#FEF3C7" stroke="#D97706"/>
    <path d="M560 480 L583 480 L580 509 L563 509 Z" fill="#FEF3C7" stroke="#D97706"/>
    <rect x="622" y="477" width="22" height="32" rx="4" fill="#FEE2E2" stroke="#EF4444"/>
    <circle cx="664" cy="493" r="11" fill="#D1FAE5" stroke="#10B981"/>
  </g>
  <g>
    <circle cx="744" cy="438" r="19" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
    <path d="M744 438 L744 425 M744 438 L754 444" fill="none" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <text x="596" y="586" font-size="12" fill="#6B7280" text-anchor="middle">Bufet sleduje hlavně to, jak dlouho zůstaneš.</text>

  <text x="400" y="626" font-size="13" fill="#6B7280" text-anchor="middle">Algoritmus skládá feed z tvého chování, historie a podobných profilů, aby udržel pozornost.</text>
</svg>