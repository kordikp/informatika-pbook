  <line x1="45" y1="232" x2="350" y2="232" stroke="#E5E7EB" stroke-width="4" stroke-linecap="round"/>
  <text x="204" y="306" font-size="12" fill="#6B7280" text-anchor="middle">Co vezmeš, tím zároveň hlasuješ.</text>

  <!-- Panel 2 -->
  <g>
    <rect x="423" y="72" width="165" height="52" rx="9" fill="#D1FAE5" stroke="#10B981"/>
    <text x="436" y="93" font-size="12.5" fill="#1E1B4B">
      <tspan x="436" y="93">Pro tebe křupavé.</tspan>
      <tspan x="436" y="110">Pro tebe zelené.</tspan>
    </text>
  </g>
  <g>
    <rect x="633" y="80" width="126" height="36" rx="9" fill="#E0F2FE" stroke="#0EA5E9"/>
