  </g>
  <g stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round" fill="none">
    <circle cx="505" cy="168" r="10" fill="#7C3AED" stroke="none"/>
    <path d="M505 179 L505 223 M505 190 L530 207 M505 222 L492 248 M505 222 L519 248"/>
  </g>
  <g stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round" fill="none">
    <circle cx="698" cy="168" r="10" fill="#0EA5E9" stroke="none"/>
    <path d="M698 179 L698 223 M698 190 L673 207 M698 222 L685 248 M698 222 L712 248"/>
  </g>
  <g stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round" fill="none">
    <circle cx="601" cy="157" r="10" fill="#10B981" stroke="none"/>
    <path d="M601 168 L601 214 M601 181 L565 207 M601 181 L638 207"/>
