      <tspan x="250" y="93">Já jablko.</tspan>
      <tspan x="250" y="110">Zase.</tspan>
    </text>
  </g>
  <g stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round" fill="none">
    <circle cx="91" cy="169" r="10" fill="#7C3AED" stroke="none"/>
    <path d="M91 180 L91 223 M91 190 L121 211 M91 222 L78 248 M91 222 L105 248"/>
  </g>
  <g stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round" fill="none">
    <circle cx="307" cy="169" r="10" fill="#0EA5E9" stroke="none"/>
    <path d="M307 180 L307 223 M307 190 L278 211 M307 222 L294 248 M307 222 L321 248"/>
  </g>
  <g stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round" fill="none">
    <circle cx="200" cy="157" r="10" fill="#10B981" stroke="none"/>
    <path d="M200 168 L200 215 M200 181 L180 199 M200 181 L220 199"/>
  </g>
  <g>
    <path d="M118 202 L145 202 L141 229 L122 229 Z" fill="#FEF3C7" stroke="#D97706"/>
    <circle cx="274" cy="215" r="11" fill="#D1FAE5" stroke="#10B981"/>
    <path d="M274 204 L279 197" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
