<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 270" role="img" aria-label="Frontend a backend aplikace: telefon s rozhraním a server s databází">
  <defs>
    <marker id="fp" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#7C3AED"/></marker>
    <marker id="fg" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#10B981"/></marker>
  </defs>
  <rect x="1" y="1" width="518" height="268" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>
  <text x="18" y="26" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#1E1B4B">Frontend a backend</text>
  <text x="18" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">Jeviště vidíš — představení drží zákulisí.</text>

  <!-- Frontend telefon -->
  <g font-family="system-ui, sans-serif">
    <rect x="40" y="60" width="150" height="176" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="115" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#10B981">FRONTEND</text>
    <text x="115" y="97" text-anchor="middle" font-size="10" fill="#6B7280">vidíš a ovládáš</text>
    <rect x="78" y="106" width="74" height="118" rx="10" fill="#F5F5F4" stroke="#1E1B4B" stroke-width="2"/>
    <rect x="86" y="116" width="58" height="12" rx="3" fill="#D1FAE5"/>
    <text x="115" y="126" text-anchor="middle" font-size="8" fill="#1E1B4B">Moje playlisty</text>
    <rect x="86" y="134" width="58" height="9" rx="3" fill="#E5E7EB"/>
    <rect x="86" y="147" width="58" height="9" rx="3" fill="#E5E7EB"/>
    <rect x="86" y="160" width="58" height="9" rx="3" fill="#E5E7EB"/>
    <circle cx="115" cy="196" r="15" fill="#10B981"/>
    <path d="M111 189 L123 196 L111 203 Z" fill="#FFFFFF"/>
  </g>

  <!-- Backend server -->
  <g font-family="system-ui, sans-serif">
    <rect x="330" y="60" width="150" height="176" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <text x="405" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#7C3AED">BACKEND</text>
    <text x="405" y="97" text-anchor="middle" font-size="10" fill="#6B7280">data, účty, logika</text>
    <rect x="358" y="106" width="94" height="20" rx="4" fill="#EDE9FE" stroke="#7C3AED"/>
    <circle cx="368" cy="116" r="3" fill="#10B981"/>
    <text x="405" y="120" text-anchor="middle" font-size="9" fill="#1E1B4B">server</text>
    <rect x="358" y="130" width="94" height="20" rx="4" fill="#EDE9FE" stroke="#7C3AED"/>
    <circle cx="368" cy="140" r="3" fill="#10B981"/>
    <text x="405" y="144" text-anchor="middle" font-size="9" fill="#1E1B4B">ověření účtu</text>
    <ellipse cx="405" cy="172" rx="34" ry="9" fill="#FEF3C7" stroke="#D97706"/>
    <path d="M371 172 V196 A34 9 0 0 0 439 196 V172" fill="#FEF3C7" stroke="#D97706"/>
    <ellipse cx="405" cy="196" rx="34" ry="9" fill="#FEF3C7" stroke="#D97706"/>
    <text x="405" y="190" text-anchor="middle" font-size="9" fill="#1E1B4B">databáze</text>
    <text x="405" y="226" text-anchor="middle" font-size="9.5" fill="#6B7280">písničky · účty · počty</text>
  </g>

  <!-- API šipky -->
  <path d="M192 130 L326 130" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#fp)"/>
  <text x="259" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#7C3AED" font-weight="600">▶ „pošli písničku X“ (API)</text>
  <path d="M326 168 L192 168" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#fg)"/>
  <text x="259" y="188" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#10B981" font-weight="600">♪ data písničky</text>

  <text x="260" y="256" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#1E1B4B" font-weight="600">Proto vidíš stejný účet z mobilu i počítače — data nebydlí v zařízení, ale na serveru.</text>
</svg>
