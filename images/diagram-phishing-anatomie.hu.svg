<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-label="Anatomie phishingové zprávy se čtyřmi varovnými signály">
  <defs>
    <marker id="pr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#EF4444"/></marker>
  </defs>
  <rect x="1" y="1" width="518" height="298" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>
  <text x="18" y="26" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#1E1B4B">Az adathalászat anatómiája</text>
  <text x="18" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">Négy jel, amely elárulja a csalást, még ha tökéletesnek is látszik.</text>

  <!-- e-mail -->
  <g font-family="system-ui, sans-serif">
    <rect x="120" y="56" width="280" height="168" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <rect x="120" y="56" width="280" height="30" rx="10" fill="#F5F5F4"/>
    <text x="134" y="75" font-size="10.5" fill="#1E1B4B">Feladó:<tspan fill="#EF4444" font-weight="700">info@bank-ellenorzes.xyz</tspan></text>
    <text x="134" y="104" font-size="12" font-weight="700" fill="#1E1B4B">A fiókját LETILTJUK!</text>
    <text x="134" y="126" font-size="10.5" fill="#6B7280">Biztonsági okokból 24 órán belül</text>
    <text x="134" y="141" font-size="10.5" fill="#6B7280">erősítse meg itt a belépési adatait:</text>
    <text x="134" y="162" font-size="10.5" fill="#0EA5E9" text-decoration="underline">https://bank-belepes.xyz/ellenorzes</text>
    <rect x="134" y="176" width="130" height="30" rx="7" fill="#EF4444"/>
    <text x="199" y="195" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">Belépés MOST</text>
  </g>

  <!-- varovné šipky -->
  <g font-family="system-ui, sans-serif" font-size="10" fill="#1E1B4B">
    <rect x="16" y="60" width="96" height="42" rx="7" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
    <text x="64" y="77" text-anchor="middle" font-weight="700">① furcsa domain</text>
    <text x="64" y="92" text-anchor="middle" fill="#6B7280">a bank címe bank.hu</text>
    <path d="M112 80 L128 72" stroke="#EF4444" stroke-width="2" marker-end="url(#pr)" fill="none"/>

    <rect x="408" y="88" width="96" height="42" rx="7" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
    <text x="456" y="105" text-anchor="middle" font-weight="700">② sürgetés</text>
    <text x="456" y="120" text-anchor="middle" fill="#6B7280">a félelem elvakít</text>
    <path d="M406 108 L390 102" stroke="#EF4444" stroke-width="2" marker-end="url(#pr)" fill="none"/>

    <rect x="16" y="146" width="96" height="42" rx="7" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
    <text x="64" y="163" text-anchor="middle" font-weight="700">③ a link máshová visz</text>
    <text x="64" y="178" text-anchor="middle" fill="#6B7280">tartsd rajta az ujjad</text>
    <path d="M112 165 L128 160" stroke="#EF4444" stroke-width="2" marker-end="url(#pr)" fill="none"/>

    <rect x="408" y="170" width="96" height="42" rx="7" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
    <text x="456" y="187" text-anchor="middle" font-weight="700">④ belépést kér</text>
    <text x="456" y="202" text-anchor="middle" fill="#6B7280">bank ilyet nem kér</text>
    <path d="M406 190 L390 190" stroke="#EF4444" stroke-width="2" marker-end="url(#pr)" fill="none"/>
  </g>

  <!-- zelený pruh -->
  <rect x="60" y="240" width="400" height="42" rx="9" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  <text x="260" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1E1B4B">🛡 Ne kattints: nyisd meg magad a bank hivatalos appját</text>
  <text x="260" y="274" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#6B7280">A más úton való ellenőrzés a tökéletes csalást is legyőzi.</text>
</svg>
