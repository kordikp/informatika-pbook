<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" role="img" aria-label="Stavy semaforu: chybná šipka a oprava">
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#7C3AED"/></marker><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#10B981"/></marker><marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#EF4444"/></marker><marker id="s" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#9CA3AF"/></marker></defs>
  <rect x="1" y="1" width="518" height="258" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>
  <g font-family="system-ui, sans-serif">
  <text x="18" y="26" font-size="17" font-weight="700" fill="#1E1B4B">Semafor: chybná šípka a oprava</text>
  <text x="18" y="44" font-size="11" fill="#6B7280">Z blikania musí viesť šípka na červenú. Inak sa na ňu semafor nikdy nevráti.</text>
  <circle cx="90" cy="150" r="34" fill="#FEE2E2" stroke="#EF4444" stroke-width="3"/>
  <text x="90" y="154" font-size="12" font-weight="700" fill="#1E1B4B" text-anchor="middle">Červená</text>
  <circle cx="260" cy="150" r="34" fill="#DCFCE7" stroke="#10B981" stroke-width="3"/>
  <text x="260" y="154" font-size="12" font-weight="700" fill="#1E1B4B" text-anchor="middle">Zelená</text>
  <circle cx="430" cy="150" r="34" fill="#FEF3C7" stroke="#D97706" stroke-width="3"/>
  <text x="430" y="154" font-size="12" font-weight="700" fill="#1E1B4B" text-anchor="middle">Bliká</text>
  <line x1="126" y1="140" x2="222" y2="140" stroke="#1E1B4B" stroke-width="2" marker-end="url(#a)"/>
  <text x="174" y="132" font-size="10" font-weight="600" fill="#1E1B4B" text-anchor="middle">uplynul čas</text>
  <line x1="296" y1="140" x2="392" y2="140" stroke="#1E1B4B" stroke-width="2" marker-end="url(#a)"/>
  <text x="344" y="132" font-size="10" font-weight="600" fill="#1E1B4B" text-anchor="middle">uplynul čas</text>
  <path d="M 410 180 Q 345 222 282 182" fill="none" stroke="#EF4444" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#r)"/>
  <text x="346" y="222" font-size="10" font-weight="700" fill="#EF4444" text-anchor="middle">✗ chyba: späť na zelenú</text>
  <path d="M 420 116 Q 260 40 104 114" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#g)"/>
  <text x="260" y="70" font-size="10" font-weight="700" fill="#10B981" text-anchor="middle">✓ oprava: uplynul čas → Červená</text>
  <text x="90" y="204" font-size="10" fill="#6B7280" text-anchor="middle">stlačenie: odpočet</text>
  <text x="240" y="204" font-size="10" fill="#6B7280" text-anchor="middle">stlačenie: nič</text>
  <text x="260" y="246" font-size="10" fill="#6B7280" text-anchor="middle">Suchý beh prstom: Červená → Zelená → Bliká → Zelená → Bliká… navždy.</text>

  </g>
</svg>
