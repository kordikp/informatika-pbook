<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" role="img" aria-label="Rytíř a jeho hitbox, mapa dungeonu jako graf">
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#7C3AED"/></marker><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#10B981"/></marker></defs>
  <rect x="1" y="1" width="518" height="258" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>
  <g font-family="system-ui, sans-serif">
  <text x="18" y="26" font-size="17" font-weight="700" fill="#1E1B4B">Two models of one game</text>
  <text x="18" y="44" font-size="11" fill="#6B7280">Collisions need only a rectangle. Finding your way needs only a graph of rooms.</text>
  <text x="34" y="72" font-size="13" font-weight="700" fill="#1E1B4B">Hitbox</text>
  <text x="102" y="152" font-size="60" fill="#1E1B4B" text-anchor="middle">🤺</text>
  <rect x="64" y="94" width="78" height="70" fill="none" stroke="#7C3AED" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="206" y="150" font-size="26" fill="#1E1B4B" text-anchor="middle">🪙</text>
  <rect x="190" y="126" width="32" height="32" fill="none" stroke="#7C3AED" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="103" y="182" font-size="10" font-weight="600" fill="#7C3AED" text-anchor="middle">x, y, width, height</text>
  <text x="134" y="208" font-size="11" font-weight="700" fill="#1E1B4B" text-anchor="middle">Rectangles overlap? → collision</text>
  <text x="134" y="226" font-size="10" fill="#6B7280" text-anchor="middle">the model leaves out cloak, colour, sword</text>
  <line x1="262" y1="60" x2="262" y2="236" stroke="#E5E7EB" stroke-width="2"/>
  <text x="280" y="72" font-size="13" font-weight="700" fill="#1E1B4B">The dungeon map as a graph</text>
  <line x1="316" y1="112" x2="420" y2="112" stroke="#9CA3AF" stroke-width="3"/>
  <line x1="316" y1="112" x2="316" y2="186" stroke="#9CA3AF" stroke-width="3"/>
  <line x1="316" y1="186" x2="420" y2="186" stroke="#9CA3AF" stroke-width="3"/>
  <line x1="420" y1="112" x2="470" y2="149" stroke="#9CA3AF" stroke-width="3"/>
  <line x1="420" y1="186" x2="470" y2="149" stroke="#9CA3AF" stroke-width="3"/>
  <rect x="286" y="99" width="60" height="26" rx="13" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="316" y="116" font-size="11" font-weight="600" fill="#1E1B4B" text-anchor="middle">Entrance</text>
  <rect x="390" y="99" width="60" height="26" rx="13" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="420" y="116" font-size="11" font-weight="600" fill="#1E1B4B" text-anchor="middle">Corridor</text>
  <rect x="286" y="173" width="60" height="26" rx="13" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="316" y="190" font-size="11" font-weight="600" fill="#1E1B4B" text-anchor="middle">Dragon</text>
  <rect x="390" y="173" width="60" height="26" rx="13" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="420" y="190" font-size="11" font-weight="600" fill="#1E1B4B" text-anchor="middle">Cellar</text>
  <rect x="440" y="136" width="60" height="26" rx="13" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="470" y="153" font-size="11" font-weight="600" fill="#1E1B4B" text-anchor="middle">Treasure</text>
  <text x="390" y="230" font-size="10" fill="#6B7280" text-anchor="middle">node = room · edge = door</text>

  </g>
</svg>
