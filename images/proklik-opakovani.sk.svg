<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-label="Robot objíždí sloup: dlouhý program z osmi bloků se zkrátí na cyklus opakuj 4× se třemi bloky">
  <defs>
    <marker id="opP" viewBox="0 0 10 10" markerWidth="3.6" markerHeight="3.6" refX="7" refY="5" orient="auto"><path d="M0 1 L10 5 L0 9 L2 5 Z" fill="#7C3AED"/></marker>
  </defs>
  <rect x="1" y="1" width="518" height="298" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>
  <text x="18" y="26" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#1E1B4B">Osem blokov, alebo tri?</text>
  <text x="18" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">Robot má obísť stĺp a vrátiť sa na štart. Rovnaká úloha, dva programy.</text>

  <!-- mapa -->
  <rect x="14" y="56" width="168" height="192" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <g stroke="#E5E7EB" stroke-width="1">
    <path d="M34 72 H162 M34 104 H162 M34 136 H162 M34 168 H162 M34 200 H162"/>
    <path d="M34 72 V200 M66 72 V200 M98 72 V200 M130 72 V200 M162 72 V200"/>
  </g>
  <rect x="66" y="104" width="64" height="64" rx="4" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="98" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#4B5563">stĺp</text>
  <g data-krok="1">
    <g fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" marker-end="url(#opP)">
      <path d="M50 178 V96"/><path d="M56 88 H138"/><path d="M146 94 V176"/><path d="M140 184 H64"/>
    </g>
    <g font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      <circle cx="50" cy="136" r="8" fill="#7C3AED"/><text x="50" y="139.5">1</text>
      <circle cx="98" cy="88" r="8" fill="#7C3AED"/><text x="98" y="91.5">2</text>
      <circle cx="146" cy="136" r="8" fill="#7C3AED"/><text x="146" y="139.5">3</text>
      <circle cx="98" cy="184" r="8" fill="#7C3AED"/><text x="98" y="187.5">4</text>
    </g>
  </g>
  <text x="50" y="191" text-anchor="middle" font-size="16">🤖</text>
  <text x="50" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#1E1B4B">štart a cieľ</text>

  <!-- dlouhý program -->
  <rect x="190" y="56" width="176" height="192" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="200" y="74" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1E1B4B">Dlhý program</text>
  <g font-family="system-ui, sans-serif" font-size="11">
    <rect x="200" y="82" width="136" height="18" rx="4" fill="#DBEAFE"/><text x="209" y="95" fill="#1D4ED8">choď 3</text>
    <rect x="200" y="102" width="136" height="18" rx="4" fill="#EDE9FE"/><text x="209" y="115" fill="#6D28D9">otoč sa doprava</text>
    <rect x="200" y="122" width="136" height="18" rx="4" fill="#DBEAFE"/><text x="209" y="135" fill="#1D4ED8">choď 3</text>
    <rect x="200" y="142" width="136" height="18" rx="4" fill="#EDE9FE"/><text x="209" y="155" fill="#6D28D9">otoč sa doprava</text>
    <rect x="200" y="162" width="136" height="18" rx="4" fill="#DBEAFE"/><text x="209" y="175" fill="#1D4ED8">choď 3</text>
    <rect x="200" y="182" width="136" height="18" rx="4" fill="#EDE9FE"/><text x="209" y="195" fill="#6D28D9">otoč sa doprava</text>
    <rect x="200" y="202" width="136" height="18" rx="4" fill="#DBEAFE"/><text x="209" y="215" fill="#1D4ED8">choď 3</text>
    <rect x="200" y="222" width="136" height="18" rx="4" fill="#EDE9FE"/><text x="209" y="235" fill="#6D28D9">otoč sa doprava</text>
  </g>
  <g data-krok="1" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <path d="M340 83 h4 v36 h-4 M340 123 h4 v36 h-4 M340 163 h4 v36 h-4 M340 203 h4 v36 h-4" fill="none" stroke="#7C3AED" stroke-width="1.5"/>
    <circle cx="355" cy="101" r="7" fill="#7C3AED"/><text x="355" y="104.5">1</text>
    <circle cx="355" cy="141" r="7" fill="#7C3AED"/><text x="355" y="144.5">2</text>
    <circle cx="355" cy="181" r="7" fill="#7C3AED"/><text x="355" y="184.5">3</text>
    <circle cx="355" cy="221" r="7" fill="#7C3AED"/><text x="355" y="224.5">4</text>
  </g>

  <!-- cyklus -->
  <g data-krok="2">
    <rect x="374" y="56" width="132" height="192" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="384" y="74" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#047857">Cyklus</text>
    <path d="M384 82 H496 V104 H398 V146 H496 V158 H384 Z" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="393" y="97" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#92400E">opakuj 4×</text>
    <g font-family="system-ui, sans-serif" font-size="11">
      <rect x="402" y="106" width="92" height="18" rx="4" fill="#DBEAFE"/><text x="409" y="119" fill="#1D4ED8">choď 3</text>
      <rect x="402" y="126" width="92" height="18" rx="4" fill="#EDE9FE"/><text x="409" y="139" fill="#6D28D9">otoč sa doprava</text>
    </g>
    <text x="440" y="196" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#047857">3 bloky</text>
    <text x="440" y="214" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#047857">namiesto 8</text>
  </g>

  <!-- popisek kroku -->
  <rect x="14" y="258" width="492" height="30" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <g font-family="system-ui, sans-serif" font-size="12" fill="#1E1B4B">
    <text x="26" y="278" data-until="2">Dlhý program má 8 blokov. Nájdeš v ňom, čo sa opakuje?</text>
    <text x="26" y="278" data-krok="1" data-until="3"><tspan font-weight="700">1 ·</tspan> Rovnaká dvojica štyrikrát za sebou: choď 3, otoč sa doprava.</text>
    <text x="26" y="278" data-krok="2"><tspan font-weight="700">2 ·</tspan> Cyklus: opakuj 4× a dovnútra len tú dvojicu. Cesta je rovnaká.</text>
  </g>
</svg>
