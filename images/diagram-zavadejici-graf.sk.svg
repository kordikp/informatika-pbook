<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 270" role="img" aria-label="Stejná čísla, jiný dojem: useknutá osa udělá z 82 % a 78 % trojnásobek, osa od nuly ukáže skoro stejný výsledek">
  <rect x="1" y="1" width="518" height="268" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>
  <text x="18" y="26" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#1E1B4B">Rovnaké čísla, iný dojem</text>
  <text x="18" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">Test: škola A má 82 %, škola B 78 %. Ktorý graf hovorí pravdu?</text>

  <!-- useknutá osa: od 76 % -->
  <rect x="26" y="56" width="225" height="176" rx="11" fill="#FFFFFF" stroke="#EF4444" stroke-width="2"/>
  <text x="138" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#EF4444">⚠ Os začína na 76 %</text>
  <line x1="60" y1="196" x2="230" y2="196" stroke="#6B7280" stroke-width="1.5"/>
  <line x1="60" y1="196" x2="60" y2="92" stroke="#6B7280" stroke-width="1.5"/>
  <text x="52" y="199" text-anchor="end" font-family="system-ui, sans-serif" font-size="10" fill="#EF4444" font-weight="700">76</text>
  <text x="52" y="102" text-anchor="end" font-family="system-ui, sans-serif" font-size="10" fill="#6B7280">84</text>
  <path d="M53 186 l6 -5 l4 5" fill="none" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="90" y="118" width="44" height="78" fill="#FEE2E2" stroke="#EF4444"/>
  <rect x="160" y="170" width="44" height="26" fill="#FEE2E2" stroke="#EF4444"/>
  <g font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1E1B4B" text-anchor="middle">
    <text x="112" y="112">82 %</text><text x="182" y="164">78 %</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="10" fill="#1E1B4B" text-anchor="middle">
    <text x="112" y="211">škola A</text><text x="182" y="211">škola B</text>
  </g>
  <text x="138" y="225" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#6B7280">dojem: A je trikrát lepšia!</text>

  <!-- krok 1: poctivý graf, osa od nuly -->
  <g data-krok="1">
    <rect x="269" y="56" width="225" height="176" rx="11" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="381" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#10B981">✓ Os od nuly</text>
    <line x1="303" y1="196" x2="473" y2="196" stroke="#6B7280" stroke-width="1.5"/>
    <line x1="303" y1="196" x2="303" y2="92" stroke="#6B7280" stroke-width="1.5"/>
    <text x="295" y="199" text-anchor="end" font-family="system-ui, sans-serif" font-size="10" fill="#6B7280">0</text>
    <text x="295" y="102" text-anchor="end" font-family="system-ui, sans-serif" font-size="10" fill="#6B7280">100</text>
    <rect x="333" y="111" width="44" height="85" fill="#D1FAE5" stroke="#10B981"/>
    <rect x="403" y="115" width="44" height="81" fill="#D1FAE5" stroke="#10B981"/>
    <g font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1E1B4B" text-anchor="middle">
      <text x="355" y="105">82 %</text><text x="425" y="109">78 %</text>
    </g>
    <g font-family="system-ui, sans-serif" font-size="10" fill="#1E1B4B" text-anchor="middle">
      <text x="355" y="211">škola A</text><text x="425" y="211">škola B</text>
    </g>
    <text x="381" y="225" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#6B7280">dojem: skoro rovnako</text>
  </g>

  <!-- krok 2: kde začíná osa -->
  <g data-krok="2">
    <circle cx="46" cy="195" r="11" fill="none" stroke="#EF4444" stroke-width="2"/>
    <text x="260" y="254" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#1E1B4B" font-weight="600">Skôr než uveríš grafu, pozri sa, kde začína os a akú má mierku.</text>
  </g>
</svg>
