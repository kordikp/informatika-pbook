<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" role="img" aria-label="Relační model: tabulky Kamarádi a Půjčky propojené klíčem">
  <defs>
    <marker id="kp" viewBox="0 0 10 10" markerWidth="4.5" markerHeight="4.5" refX="7" refY="5" orient="auto"><path d="M0 1 L10 5 L0 9 L2 5 Z" fill="#7C3AED"/></marker>
  </defs>
  <rect x="1" y="1" width="518" height="258" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>
  <text x="18" y="26" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#1E1B4B">Relační model: tabulky a klíč</text>
  <text x="18" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">Údaj bydlí na jednom místě — jinde se na něj jen ukazuje.</text>

  <!-- Tabulka Kamarádi: sloupec id je klíč -->
  <g font-family="system-ui, sans-serif" font-size="11">
    <text x="30" y="72" font-size="12" font-weight="700" fill="#1E1B4B">Kamarádi</text>
    <rect x="30" y="80" width="170" height="24" rx="4" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="40" y="96" font-weight="700" fill="#047857">id</text>
    <text x="72" y="96" font-weight="700" fill="#1E1B4B">jméno</text>
    <text x="132" y="96" font-weight="700" fill="#1E1B4B">telefon</text>
    <rect x="30" y="104" width="170" height="24" fill="#FFFFFF" stroke="#E5E7EB"/>
    <rect x="30" y="128" width="170" height="24" fill="#FFFFFF" stroke="#E5E7EB"/>
    <rect x="30.5" y="104.5" width="31" height="47" fill="#ECFDF5"/>
    <text x="40" y="120" fill="#047857" font-weight="700">1</text>
    <text x="72" y="120" fill="#1E1B4B">Kuba</text>
    <text x="132" y="120" fill="#6B7280">777 123…</text>
    <text x="40" y="144" fill="#047857" font-weight="700">2</text>
    <text x="72" y="144" fill="#1E1B4B">Eliška</text>
    <text x="132" y="144" fill="#6B7280">606 987…</text>
    <text data-krok="2" x="30" y="170" font-size="10" fill="#047857" font-weight="700">↑ klíč: jednoznačné id</text>
  </g>

  <!-- Tabulka Půjčky: kamarad_id ukazuje do Kamarádů -->
  <g font-family="system-ui, sans-serif" font-size="11">
    <text x="300" y="72" font-size="12" font-weight="700" fill="#1E1B4B">Půjčky</text>
    <rect x="300" y="80" width="196" height="24" rx="4" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="310" y="96" font-weight="700" fill="#7C3AED">kamarad_id</text>
    <text x="388" y="96" font-weight="700" fill="#1E1B4B">hra</text>
    <text x="456" y="96" font-weight="700" fill="#1E1B4B">od</text>
    <rect x="300" y="104" width="196" height="24" fill="#FFFFFF" stroke="#E5E7EB"/>
    <rect x="300" y="128" width="196" height="24" fill="#FFFFFF" stroke="#E5E7EB"/>
    <rect x="300.5" y="104.5" width="77" height="47" fill="#F5F3FF"/>
    <text x="339" y="120" text-anchor="middle" fill="#7C3AED" font-weight="700">1</text>
    <text x="388" y="120" fill="#1E1B4B">Zelda</text>
    <text x="456" y="120" fill="#6B7280">3. 5.</text>
    <text x="339" y="144" text-anchor="middle" fill="#7C3AED" font-weight="700">2</text>
    <text x="388" y="144" fill="#1E1B4B">Mario Kart</text>
    <text x="456" y="144" fill="#6B7280">10. 5.</text>
  </g>

  <!-- propojení: každý řádek půjčky ukazuje na jeden řádek kamaráda -->
  <g data-krok="1">
  <g stroke="#7C3AED" stroke-width="2" fill="none" marker-end="url(#kp)">
    <path d="M298 116 H206"/>
    <path d="M298 140 H206"/>
  </g>
  <circle cx="300" cy="116" r="2.5" fill="#7C3AED"/>
  <circle cx="300" cy="140" r="2.5" fill="#7C3AED"/>
  <text x="250" y="107" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#7C3AED">ukazuje na</text>
  </g>
  <text data-krok="2" x="300" y="170" font-family="system-ui, sans-serif" font-size="10" fill="#7C3AED" font-weight="700">kamarad_id = 1 → řádek s id 1</text>

  <!-- výhoda -->
  <g data-krok="3">
  <rect x="30" y="188" width="466" height="52" rx="9" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="46" y="210" font-family="system-ui, sans-serif" font-size="11" fill="#1E1B4B">📱 Kuba si změní telefon? Opravíš <tspan font-weight="700">jeden řádek</tspan> v tabulce Kamarádi —</text>
  <text x="46" y="228" font-family="system-ui, sans-serif" font-size="11" fill="#1E1B4B">všechny půjčky na něj dál správně ukazují. Žádné opisování, žádné zapomenuté kopie.</text>
  </g>
</svg>
