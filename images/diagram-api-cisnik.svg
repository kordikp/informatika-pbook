<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" role="img" aria-label="API jako číšník: appka si objedná, kuchyně připraví, číšník přenese">
  <defs>
    <marker id="ap" viewBox="0 0 10 10" markerWidth="4.5" markerHeight="4.5" refX="7" refY="5" orient="auto"><path d="M0 1 L10 5 L0 9 L2 5 Z" fill="#7C3AED"/></marker>
    <marker id="ag" viewBox="0 0 10 10" markerWidth="4.5" markerHeight="4.5" refX="7" refY="5" orient="auto"><path d="M0 1 L10 5 L0 9 L2 5 Z" fill="#10B981"/></marker>
  </defs>
  <rect x="1" y="1" width="518" height="248" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>
  <text x="18" y="26" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#1E1B4B">API: jídelní lístek digitálního světa</text>
  <text x="18" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">Objednáš si výsledek — a nemusíš vědět, jak ho kuchyně připravuje.</text>

  <!-- Appka (host) -->
  <rect x="14" y="70" width="106" height="150" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <circle cx="67" cy="105" r="19" fill="#D1FAE5"/>
  <text x="67" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19">📱</text>
  <text x="67" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1E1B4B">Appka počasí</text>
  <text x="67" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">host u stolu</text>
  <text x="67" y="197" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#6B7280">nemá meteostanici,</text>
  <text x="67" y="211" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#6B7280">tak si objedná</text>

  <!-- API (číšník) -->
  <rect x="207" y="70" width="106" height="150" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <circle cx="260" cy="105" r="19" fill="#FFFFFF"/>
  <text x="260" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19">🤵</text>
  <text x="260" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1E1B4B">API</text>
  <text x="260" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">číšník s lístkem</text>
  <rect x="214" y="172" width="92" height="38" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="260" y="187" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#1E1B4B">domluvený jazyk:</text>
  <text x="260" y="201" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#6B7280">otázka a odpověď</text>

  <!-- Server (kuchyně) -->
  <rect x="400" y="70" width="106" height="150" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
  <circle cx="453" cy="105" r="19" fill="#FEF3C7"/>
  <text x="453" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19">🍳</text>
  <text x="453" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1E1B4B">Meteoslužba</text>
  <text x="453" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">kuchyně (server)</text>
  <text x="453" y="197" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#6B7280">jak vaří, appka</text>
  <text x="453" y="211" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#6B7280">řešit nemusí</text>

  <!-- šipky: objednávka tam, jídlo zpátky -->
  <path d="M120 110 L203 110" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#ap)"/>
  <text x="163.5" y="101" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#7C3AED" font-weight="600">„Počasí v Brně?“</text>
  <path d="M313 110 L396 110" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#ap)"/>
  <path d="M400 128 L317 128" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#ag)"/>
  <path d="M207 128 L124 128" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#ag)"/>
  <text x="163.5" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#10B981" font-weight="600">„21 °C, jasno“</text>
  <text x="356.5" y="101" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#7C3AED" font-weight="600">dotaz</text>
  <text x="356.5" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#10B981" font-weight="600">data</text>

  <text x="260" y="238" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">Stejně si appky objednávají mapy, platby, přihlášení — i odpovědi AI.</text>
</svg>
