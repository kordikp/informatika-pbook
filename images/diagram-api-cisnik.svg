<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" role="img" aria-label="API jako číšník: appka si objedná, kuchyně připraví, číšník přenese">
  <defs>
    <marker id="ap" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#7C3AED"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#10B981"/></marker>
  </defs>
  <rect x="1" y="1" width="518" height="248" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>
  <text x="18" y="26" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#1E1B4B">API: jídelní lístek digitálního světa</text>
  <text x="18" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">Objednáš si výsledek — a nemusíš vědět, jak ho kuchyně připravuje.</text>

  <!-- Appka (host) -->
  <rect x="18" y="70" width="130" height="150" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <circle cx="83" cy="105" r="19" fill="#D1FAE5"/>
  <text x="83" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19">📱</text>
  <text x="83" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1E1B4B">Appka počasí</text>
  <text x="83" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">host u stolu</text>
  <text x="83" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">žádnou meteostanici</text>
  <text x="83" y="213" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">nemá — objednává si</text>

  <!-- API (číšník) -->
  <rect x="195" y="70" width="130" height="150" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <circle cx="260" cy="105" r="19" fill="#FFFFFF"/>
  <text x="260" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19">🤵</text>
  <text x="260" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1E1B4B">API</text>
  <text x="260" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">číšník s lístkem</text>
  <rect x="212" y="172" width="96" height="36" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="260" y="187" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#1E1B4B">domluvený jazyk:</text>
  <text x="260" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#6B7280">jak se ptát, co přijde</text>

  <!-- Server (kuchyně) -->
  <rect x="372" y="70" width="130" height="150" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
  <circle cx="437" cy="105" r="19" fill="#FEF3C7"/>
  <text x="437" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19">🍳</text>
  <text x="437" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1E1B4B">Server meteoslužby</text>
  <text x="437" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">kuchyně</text>
  <text x="437" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">jak vaří, appka</text>
  <text x="437" y="213" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">řešit nemusí</text>

  <!-- šipky -->
  <path d="M148 110 L192 110" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#ap)"/>
  <text x="170" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#7C3AED" font-weight="600">„Počasí v Brně?“</text>
  <path d="M325 110 L369 110" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#ap)"/>
  <path d="M369 128 L325 128" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#ag)"/>
  <path d="M192 128 L148 128" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#ag)"/>
  <text x="170" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#10B981" font-weight="600">„21 °C, jasno“</text>

  <text x="260" y="238" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">Stejně si appky objednávají mapy, platby, přihlášení — i odpovědi AI.</text>
</svg>
