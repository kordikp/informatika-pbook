  <rect x="365" y="108" width="139" height="42" rx="9" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="375" y="127" font-family="system-ui, sans-serif" font-size="13">🚀</text>
  <text x="394" y="128" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1E1B4B">Tvoříš</text>
  <text x="394" y="143" font-family="system-ui, sans-serif" font-size="10" fill="#6B7280">web · appka · hra</text>
  <rect x="466" y="116" width="14" height="26" rx="3" fill="#EDE9FE"/>
  <rect x="469" y="120" width="8" height="3" rx="1.5" fill="#7C3AED"/>
  <rect x="469" y="126" width="8" height="3" rx="1.5" fill="#7C3AED"/>
  <rect x="469" y="132" width="5" height="3" rx="1.5" fill="#C4B5FD"/>
  <rect x="484" y="116" width="14" height="26" rx="3" fill="#E0F2FE"/>
  <circle cx="491" cy="126" r="4.5" fill="#0EA5E9"/>
  <path d="M489.5 123.5 L494 126 L489.5 128.5Z" fill="#FFFFFF"/>
  <rect x="487.5" y="134" width="7" height="3" rx="1.5" fill="#7DD3FC"/>

  <!-- Chráníš se -->
  <rect x="365" y="158" width="139" height="42" rx="9" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
  <text x="375" y="177" font-family="system-ui, sans-serif" font-size="13">🛡️</text>
  <text x="394" y="178" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1E1B4B">Chráníš se</text>
  <text x="394" y="193" font-family="system-ui, sans-serif" font-size="10" fill="#6B7280">hesla · phishing · stopa</text>
  <path d="M481 164 L494 168 V177 Q494 187 481 192 Q468 187 468 177 V168Z" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <path d="M475.5 177 L479.5 181 L487 172.5" fill="none" stroke="#D97706" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
