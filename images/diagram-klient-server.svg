<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" font-family="system-ui, sans-serif" role="img" aria-labelledby="kst ksd">
  <title id="kst">Klient a server: bleskový rozhovor</title>
  <desc id="ksd">Telefon jako klient pošle serveru požadavek „pošli mi mapy.cz“ a server mu vrátí odpověď s HTML a obrázky. Připojit se dá přes Wi-Fi, kabel nebo mobilní data.</desc>
  <defs>
    <marker id="ks-ap" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#7C3AED"/>
    </marker>
    <marker id="ks-ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#10B981"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="518" height="258" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>

  <text x="18" y="25" font-size="18" font-weight="700" fill="#1E1B4B">Klient a server: bleskový rozhovor</text>
  <text x="18" y="43" font-size="11" fill="#6B7280">Každá stránka na webu = požadavek tam a odpověď zpátky.</text>

  <!-- Klient -->
  <rect x="24" y="66" width="120" height="128" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <rect x="64" y="80" width="40" height="64" rx="6" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="2"/>
  <rect x="69" y="88" width="30" height="44" rx="2" fill="#E0F2FE"/>
  <rect x="72" y="92" width="24" height="7" rx="2" fill="#FFFFFF"/>
  <rect x="69" y="104" width="30" height="28" fill="#D1FAE5"/>
  <path d="M72 128 C80 118 88 122 96 108" fill="none" stroke="#0EA5E9" stroke-width="2"/>
  <circle cx="84" cy="116" r="3" fill="#EF4444"/>
  <rect x="77" y="83" width="14" height="3" rx="1.5" fill="#E5E7EB"/>
  <circle cx="84" cy="138" r="2" fill="#E5E7EB"/>
  <text x="84" y="166" text-anchor="middle" font-size="13" font-weight="700" fill="#1E1B4B">Klient</text>
  <text x="84" y="182" text-anchor="middle" font-size="11" fill="#6B7280">tvůj telefon</text>

  <!-- Server -->
  <rect x="376" y="66" width="120" height="128" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <rect x="406" y="78" width="60" height="68" rx="4" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="2"/>
  <rect x="411" y="84" width="50" height="16" rx="2" fill="#D1FAE5"/>
  <path d="M415 89 H440 M415 95 H440" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="454" cy="92" r="2.5" fill="#10B981"/>
  <rect x="411" y="104" width="50" height="16" rx="2" fill="#D1FAE5"/>
  <path d="M415 109 H440 M415 115 H440" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="454" cy="112" r="2.5" fill="#D97706"/>
  <rect x="411" y="124" width="50" height="16" rx="2" fill="#D1FAE5"/>
  <path d="M415 129 H440 M415 135 H440" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="454" cy="132" r="2.5" fill="#10B981"/>
  <text x="436" y="166" text-anchor="middle" font-size="13" font-weight="700" fill="#1E1B4B">Server</text>
  <text x="436" y="182" text-anchor="middle" font-size="11" fill="#6B7280">tady stránka bydlí</text>

  <!-- požadavek -->
  <text x="260" y="92" text-anchor="middle" font-size="11" fill="#1E1B4B">požadavek: „pošli mi mapy.cz“</text>
  <path d="M150 104 L370 104" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#ks-ap)"/>

  <!-- odpověď -->
  <path d="M370 148 L150 148" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#ks-ag)"/>
  <text x="260" y="166" text-anchor="middle" font-size="11" fill="#1E1B4B">odpověď: HTML + obrázky</text>

  <!-- připojení -->
  <text x="260" y="214" text-anchor="middle" font-size="11" fill="#6B7280">Po čem požadavek i odpověď běží:</text>
  <rect x="132" y="222" width="64" height="26" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="164" y="239" text-anchor="middle" font-size="11" fill="#1E1B4B">📶 Wi-Fi</text>
  <rect x="210" y="222" width="64" height="26" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="242" y="239" text-anchor="middle" font-size="11" fill="#1E1B4B">🔌 kabel</text>
  <rect x="288" y="222" width="100" height="26" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="338" y="239" text-anchor="middle" font-size="11" fill="#1E1B4B">📡 mobilní data</text>
</svg>
