<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-label="Anatomie phishingové zprávy se čtyřmi varovnými signály">
  <defs>
    <marker id="pr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#EF4444"/></marker>
  </defs>
  <rect x="1" y="1" width="518" height="298" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>
  <text x="18" y="26" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#1E1B4B">Anatomie phishingu</text>
  <text x="18" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">Čtyři signály, které podvod prozradí — i když vypadá dokonale.</text>

  <!-- e-mail -->
  <g font-family="system-ui, sans-serif">
    <rect x="120" y="56" width="280" height="168" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <rect x="120" y="56" width="280" height="30" rx="10" fill="#F5F5F4"/>
    <text x="134" y="75" font-size="10.5" fill="#1E1B4B">Od: <tspan fill="#EF4444" font-weight="700">podpora@banka-overeni.xyz</tspan></text>
    <text x="134" y="104" font-size="12" font-weight="700" fill="#1E1B4B">Váš účet bude ZABLOKOVÁN!</text>
    <text x="134" y="126" font-size="10.5" fill="#6B7280">Z bezpečnostních důvodů musíte do 24 hodin</text>
    <text x="134" y="141" font-size="10.5" fill="#6B7280">potvrdit své přihlašovací údaje zde:</text>
    <text x="134" y="162" font-size="10.5" fill="#0EA5E9" text-decoration="underline">https://banka-login.xyz/overeni</text>
    <rect x="134" y="176" width="130" height="30" rx="7" fill="#EF4444"/>
    <text x="199" y="195" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">Přihlásit HNED</text>
  </g>

  <!-- varovné šipky -->
  <g font-family="system-ui, sans-serif" font-size="10" fill="#1E1B4B">
    <rect x="16" y="60" width="96" height="42" rx="7" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
    <text x="64" y="77" text-anchor="middle" font-weight="700">① divná doména</text>
    <text x="64" y="92" text-anchor="middle" fill="#6B7280">banka je banka.cz</text>
    <path d="M112 80 L128 72" stroke="#EF4444" stroke-width="2" marker-end="url(#pr)" fill="none"/>

    <rect x="408" y="88" width="96" height="42" rx="7" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
    <text x="456" y="105" text-anchor="middle" font-weight="700">② nátlak na spěch</text>
    <text x="456" y="120" text-anchor="middle" fill="#6B7280">strach vypíná rozum</text>
    <path d="M406 108 L390 102" stroke="#EF4444" stroke-width="2" marker-end="url(#pr)" fill="none"/>

    <rect x="16" y="146" width="96" height="42" rx="7" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
    <text x="64" y="163" text-anchor="middle" font-weight="700">③ odkaz vede jinam</text>
    <text x="64" y="178" text-anchor="middle" fill="#6B7280">podrž prst a uvidíš</text>
    <path d="M112 165 L128 160" stroke="#EF4444" stroke-width="2" marker-end="url(#pr)" fill="none"/>

    <rect x="408" y="170" width="96" height="42" rx="7" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
    <text x="456" y="187" text-anchor="middle" font-weight="700">④ chce přihlášení</text>
    <text x="456" y="202" text-anchor="middle" fill="#6B7280">banka to nedělá</text>
    <path d="M406 190 L390 190" stroke="#EF4444" stroke-width="2" marker-end="url(#pr)" fill="none"/>
  </g>

  <!-- zelený pruh -->
  <rect x="60" y="240" width="400" height="42" rx="9" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  <text x="260" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1E1B4B">🛡 Neklikej — otevři si banku sám v oficiální appce</text>
  <text x="260" y="274" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#6B7280">Ověření jinou cestou porazí i dokonalý podvod.</text>
</svg>
