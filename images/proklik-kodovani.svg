    <text x="35" y="205" fill="#9CA3AF">0</text><text x="57" y="205" fill="#9CA3AF">0</text><text x="79" y="205" fill="#9CA3AF">0</text><text x="101" y="205" fill="#FFFFFF">1</text><text x="123" y="205" fill="#FFFFFF">1</text><text x="145" y="205" fill="#9CA3AF">0</text><text x="167" y="205" fill="#9CA3AF">0</text><text x="189" y="205" fill="#9CA3AF">0</text>
