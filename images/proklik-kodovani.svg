  <!-- krok 3: řádky jako bity -->
  <g data-krok="3" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#1E1B4B">
    <text x="214" y="73">01100110</text>
    <text x="214" y="95">11111111</text>
    <text x="214" y="117">11111111</text>
    <text x="214" y="139">11111111</text>
    <text x="214" y="161">01111110</text>
    <text x="214" y="183">00111100</text>
    <text x="214" y="205">00011000</text>
    <text x="214" y="227">00000000</text>
  </g>
  <g data-krok="3">
    <rect x="300" y="58" width="206" height="92" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <text x="314" y="84" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#1E1B4B">64 pixelů = 64 bitů</text>
    <text x="314" y="108" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#7C3AED">= 8 bytů</text>
    <text x="314" y="134" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">1 byte = 8 bitů, tedy jeden řádek</text>
  </g>
  <g data-krok="4">
    <rect x="300" y="160" width="206" height="74" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
    <text x="314" y="182" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#047857">Dvojnásobné rozlišení</text>
    <text x="314" y="201" font-family="system-ui, sans-serif" font-size="12" fill="#1E1B4B">16 × 16 = 256 pixelů</text>
    <text x="314" y="221" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1E1B4B">4× víc čísel, 4× větší soubor</text>
  </g>

  <!-- popisek kroku -->
  <rect x="14" y="258" width="492" height="30" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <g font-family="system-ui, sans-serif" font-size="12" fill="#1E1B4B">
    <text x="26" y="278" data-until="2">Srdíčko 8 × 8 pixelů. Pro tebe obrázek. A pro počítač?</text>
    <text x="26" y="278" data-krok="1" data-until="3"><tspan font-weight="700">1 ·</tspan> Rozdělíš ho na mřížku: 8 × 8 = 64 pixelů.</text>
    <text x="26" y="278" data-krok="2" data-until="4"><tspan font-weight="700">2 ·</tspan> Každý pixel je jedno číslo: 0 = bílá, 1 = černá.</text>
    <text x="26" y="278" data-krok="3" data-until="5"><tspan font-weight="700">3 ·</tspan> Řádek po řádku je to 64 nul a jedniček.</text>
    <text x="26" y="278" data-krok="4"><tspan font-weight="700">4 ·</tspan> Dvakrát jemnější mřížka dá 4× víc čísel. Proto je 4K video velké.</text>
  </g>
