<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="system-ui, sans-serif" role="img" aria-labelledby="ap-title ap-desc">
  <title id="ap-title">Ekonomika pozornosti</title>
  <desc id="ap-desc">Koloběh peněz: ty scrolluješ a dáváš čas, platforma ti ukazuje reklamy, inzerent platformě platí a algoritmus se ladí tak, aby tě udržel déle.</desc>
  <defs>
    <marker id="ap-arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#10B981"/>
    </marker>
    <marker id="ap-arrow-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#7C3AED"/>
    </marker>
    <marker id="ap-arrow-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#D97706"/>
    </marker>
    <marker id="ap-arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#0EA5E9"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="518" height="298" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>

  <text x="18" y="25" font-size="18" font-weight="700" fill="#1E1B4B">Ekonomika pozornosti</text>
  <text x="18" y="43" font-size="11" fill="#6B7280">Koloběh peněz: kdo platí, když je appka „zdarma“?</text>

  <!-- šipky cyklu (po směru hodinových ručiček) -->
  <path d="M226 95 L293 95" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#ap-arrow-green)"/>
  <text x="260" y="87" text-anchor="middle" font-size="11" fill="#6B7280">⏱ tvůj čas</text>
  <path d="M383 130 L383 181" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#ap-arrow-purple)"/>
  <path d="M294 217 L227 217" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#ap-arrow-amber)"/>
  <path d="M137 182 L137 131" fill="none" stroke="#0EA5E9" stroke-width="2" marker-end="url(#ap-arrow-blue)"/>

  <!-- smyčka uprostřed -->
  <circle cx="260" cy="156" r="17" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <text x="260" y="161" text-anchor="middle" font-size="14">🔁</text>

  <!-- 1 Ty scrolluješ -->
  <rect x="52" y="64" width="170" height="62" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <circle cx="78" cy="95" r="14" fill="#D1FAE5"/>
  <text x="78" y="100" text-anchor="middle" font-size="14">📱</text>
  <text x="100" y="91" font-size="12.5" font-weight="700" fill="#1E1B4B">Ty scrolluješ</text>
  <text x="100" y="108" font-size="11" fill="#6B7280">⏱ dáváš svůj čas</text>
  <circle cx="54" cy="66" r="10" fill="#10B981"/>
  <text x="54" y="70" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">1</text>

  <!-- 2 Platforma -->
  <rect x="298" y="64" width="170" height="62" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <circle cx="324" cy="95" r="14" fill="#EDE9FE"/>
  <text x="324" y="100" text-anchor="middle" font-size="14">📢</text>
  <text x="346" y="91" font-size="12.5" font-weight="700" fill="#1E1B4B">Platforma</text>
  <text x="346" y="108" font-size="11" fill="#6B7280">ukazuje ti reklamy</text>
  <circle cx="300" cy="66" r="10" fill="#7C3AED"/>
  <text x="300" y="70" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">2</text>

  <!-- 3 Inzerent -->
  <rect x="298" y="186" width="170" height="62" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
  <circle cx="324" cy="217" r="14" fill="#FEF3C7"/>
  <text x="324" y="222" text-anchor="middle" font-size="14">💰</text>
  <text x="346" y="213" font-size="12.5" font-weight="700" fill="#1E1B4B">Inzerent</text>
  <text x="346" y="230" font-size="11" fill="#6B7280">platí platformě</text>
  <circle cx="300" cy="188" r="10" fill="#D97706"/>
  <text x="300" y="192" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">3</text>

  <!-- 4 Algoritmus -->
  <rect x="52" y="186" width="170" height="62" rx="10" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="2"/>
  <circle cx="78" cy="217" r="14" fill="#E0F2FE"/>
  <text x="78" y="222" text-anchor="middle" font-size="14">⚙️</text>
  <text x="100" y="207" font-size="12.5" font-weight="700" fill="#1E1B4B">Algoritmus</text>
  <text x="100" y="221" font-size="11" fill="#6B7280">platforma ho ladí,</text>
  <text x="100" y="235" font-size="11" fill="#6B7280">aby tě udržel déle</text>
  <circle cx="54" cy="188" r="10" fill="#0EA5E9"/>
  <text x="54" y="192" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">4</text>

  <!-- popisek -->
  <rect x="90" y="262" width="340" height="26" rx="13" fill="#EDE9FE"/>
  <text x="260" y="279" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1E1B4B">Appka je zdarma — zbožím je tvoje pozornost.</text>
</svg>
