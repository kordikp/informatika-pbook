<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 270" role="img" aria-label="Tři stavební kameny řízení toku: sekvence, větvení a cyklus">
  <defs>
    <marker id="rg" viewBox="0 0 10 10" markerWidth="4.5" markerHeight="4.5" refX="7" refY="5" orient="auto"><path d="M0 1 L10 5 L0 9 L2 5 Z" fill="#10B981"/></marker>
    <marker id="rp" viewBox="0 0 10 10" markerWidth="4.5" markerHeight="4.5" refX="7" refY="5" orient="auto"><path d="M0 1 L10 5 L0 9 L2 5 Z" fill="#7C3AED"/></marker>
    <marker id="ra" viewBox="0 0 10 10" markerWidth="4.5" markerHeight="4.5" refX="7" refY="5" orient="auto"><path d="M0 1 L10 5 L0 9 L2 5 Z" fill="#D97706"/></marker>
  </defs>
  <rect x="1" y="1" width="518" height="268" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>
  <text x="18" y="26" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#1E1B4B">Tri kamene každého programu</text>
  <text x="18" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">Z týchto troch sa dá poskladať úplne všetko, od kalkulačky po Minecraft.</text>

  <!-- SEKVENCE -->
  <rect x="18" y="56" width="152" height="196" rx="11" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="94" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#10B981">SEKVENCIA</text>
  <text x="94" y="93" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#6B7280">rob poporiadku</text>
  <rect x="40" y="102" width="108" height="26" rx="6" fill="#D1FAE5"/>
  <text x="94" y="119" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#1E1B4B">vstaň</text>
  <path d="M94 128 L94 138" stroke="#10B981" stroke-width="2" marker-end="url(#rg)"/>
  <rect x="40" y="141" width="108" height="26" rx="6" fill="#D1FAE5"/>
  <text x="94" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#1E1B4B">obleč sa</text>
  <path d="M94 167 L94 177" stroke="#10B981" stroke-width="2" marker-end="url(#rg)"/>
  <rect x="40" y="180" width="108" height="26" rx="6" fill="#D1FAE5"/>
  <text x="94" y="197" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#1E1B4B">naraňajkuj sa</text>
  <text x="94" y="238" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#6B7280">poradie sa nedá prehodiť</text>

  <!-- VĚTVENÍ -->
  <rect x="184" y="56" width="152" height="196" rx="11" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="260" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#7C3AED">VETVENIE</text>
  <text x="260" y="93" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#6B7280">keď…, tak…, inak…</text>
  <path d="M260 104 L290 124 L260 144 L230 124 Z" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="260" y="128" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1E1B4B">prší?</text>
  <path d="M230 124 H228 Q222 124 222 130 V172" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#rp)"/>
  <path d="M290 124 H292 Q298 124 298 130 V172" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#rp)"/>
  <text x="227" y="156" font-family="system-ui, sans-serif" font-size="10" fill="#10B981" font-weight="700">áno</text>
  <text x="293" y="156" text-anchor="end" font-family="system-ui, sans-serif" font-size="10" fill="#D97706" font-weight="700">nie</text>
  <rect x="190" y="176" width="64" height="34" rx="6" fill="#EDE9FE"/>
  <text x="222" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#1E1B4B">nasaď si</text>
  <text x="222" y="203" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#1E1B4B">kapucňu</text>
  <rect x="266" y="176" width="64" height="34" rx="6" fill="#EDE9FE"/>
  <text x="298" y="197" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#1E1B4B">choď tak</text>
  <text x="260" y="238" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#6B7280">vždy práve jedna cesta</text>

  <!-- CYKLUS -->
  <rect x="350" y="56" width="152" height="196" rx="11" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
  <text x="426" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#D97706">CYKLUS</text>
  <text x="426" y="93" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#6B7280">opakuj, kým platí</text>
  <rect x="372" y="106" width="108" height="36" rx="6" fill="#FEF3C7"/>
  <text x="426" y="121" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#1E1B4B">kým nie si</text>
  <text x="426" y="134" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#1E1B4B">pri škole…</text>
  <rect x="372" y="160" width="108" height="26" rx="6" fill="#FEF3C7"/>
  <text x="426" y="177" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#1E1B4B">urob krok</text>
  <path d="M426 142 L426 154" stroke="#D97706" stroke-width="2" marker-end="url(#ra)"/>
  <path d="M480 173 H484 Q492 173 492 165 V132 Q492 124 486 124" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#ra)" stroke-dasharray="4 3"/>
  <text x="426" y="212" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#6B7280">krok napíšeš raz,</text>
  <text x="426" y="225" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#6B7280">vykoná sa stokrát</text>
</svg>
