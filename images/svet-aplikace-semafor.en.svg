<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" role="img" aria-label="Stavy semaforu: chybná šipka a oprava">
  <defs><marker id="a" viewBox="0 0 10 10" markerWidth="4.5" markerHeight="4.5" refX="7" refY="5" orient="auto"><path d="M0 1 L10 5 L0 9 L2 5 Z" fill="#7C3AED"/></marker><marker id="g" viewBox="0 0 10 10" markerWidth="4.5" markerHeight="4.5" refX="7" refY="5" orient="auto"><path d="M0 1 L10 5 L0 9 L2 5 Z" fill="#10B981"/></marker><marker id="r" viewBox="0 0 10 10" markerWidth="4.5" markerHeight="4.5" refX="7" refY="5" orient="auto"><path d="M0 1 L10 5 L0 9 L2 5 Z" fill="#EF4444"/></marker><marker id="s" viewBox="0 0 10 10" markerWidth="4.5" markerHeight="4.5" refX="7" refY="5" orient="auto"><path d="M0 1 L10 5 L0 9 L2 5 Z" fill="#9CA3AF"/></marker></defs>
  <rect x="1" y="1" width="518" height="258" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>
  <g font-family="system-ui, sans-serif">
  <text x="18" y="26" font-size="17" font-weight="700" fill="#1E1B4B">Traffic light: the wrong arrow and the fix</text>
  <text x="18" y="44" font-size="11" fill="#6B7280">An arrow from flashing has to lead to red. Otherwise the light never gets back to it.</text>
  <circle cx="90" cy="150" r="34" fill="#FEE2E2" stroke="#EF4444" stroke-width="3"/>
  <text x="90" y="154" font-size="12" font-weight="700" fill="#1E1B4B" text-anchor="middle">Red</text>
  <circle cx="260" cy="150" r="34" fill="#DCFCE7" stroke="#10B981" stroke-width="3"/>
  <text x="260" y="154" font-size="12" font-weight="700" fill="#1E1B4B" text-anchor="middle">Green</text>
  <circle cx="430" cy="150" r="34" fill="#FEF3C7" stroke="#D97706" stroke-width="3"/>
  <text x="430" y="154" font-size="12" font-weight="700" fill="#1E1B4B" text-anchor="middle">Flashing</text>
  <line x1="126" y1="140" x2="222" y2="140" stroke="#1E1B4B" stroke-width="2" marker-end="url(#a)"/>
  <text x="174" y="132" font-size="10" font-weight="600" fill="#1E1B4B" text-anchor="middle">time runs out</text>
  <line x1="296" y1="140" x2="392" y2="140" stroke="#1E1B4B" stroke-width="2" marker-end="url(#a)"/>
  <text x="344" y="132" font-size="10" font-weight="600" fill="#1E1B4B" text-anchor="middle">time runs out</text>
  <path d="M 410 180 Q 345 222 282 182" fill="none" stroke="#EF4444" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#r)"/>
  <text x="346" y="222" font-size="10" font-weight="700" fill="#EF4444" text-anchor="middle">✗ bug: back to green</text>
  <path d="M 420 116 Q 260 40 104 114" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#g)"/>
  <text x="260" y="70" font-size="10" font-weight="700" fill="#10B981" text-anchor="middle">✓ fix: time runs out → Red</text>
  <text x="90" y="204" font-size="10" fill="#6B7280" text-anchor="middle">press: countdown</text>
  <text x="240" y="204" font-size="10" fill="#6B7280" text-anchor="middle">press: nothing</text>
  <text x="260" y="246" font-size="10" fill="#6B7280" text-anchor="middle">Dry run with a finger: Red → Green → Flashing → Green → Flashing… forever.</text>

  </g>
</svg>
