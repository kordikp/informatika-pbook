<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" role="img" aria-label="Rozepsaný text v operační paměti a uložený soubor v úložišti">
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#7C3AED"/></marker><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#10B981"/></marker><marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#EF4444"/></marker><marker id="s" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#9CA3AF"/></marker></defs>
  <rect x="1" y="1" width="518" height="258" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>
  <g font-family="system-ui, sans-serif">
  <text x="18" y="26" font-size="17" font-weight="700" fill="#1E1B4B">What survives closing the app</text>
  <text x="18" y="44" font-size="11" fill="#6B7280">Unsaved text is only in working memory. Only saving gets it into storage.</text>
  <rect x="20" y="58" width="220" height="160" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="130" y="80" font-size="12" font-weight="700" fill="#1E1B4B" text-anchor="middle">working memory · 6 GB</text>
  <text x="130" y="96" font-size="10" fill="#6B7280" text-anchor="middle">fast, but it forgets</text>
  <rect x="36" y="108" width="188" height="26" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
  <text x="48" y="125" font-size="11" font-weight="600" fill="#1E1B4B">unfinished report</text>
  <rect x="36" y="142" width="188" height="26" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
  <text x="48" y="159" font-size="11" font-weight="600" fill="#1E1B4B">game in progress</text>
  <rect x="36" y="176" width="188" height="26" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
  <text x="48" y="193" font-size="11" font-weight="600" fill="#1E1B4B">open web page</text>
  <rect x="32" y="104" width="196" height="34" rx="8" fill="none" stroke="#EF4444" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="130" y="236" font-size="10" font-weight="700" fill="#EF4444" text-anchor="middle">⚡ the phone closed the app: the report is gone</text>
  <rect x="300" y="58" width="200" height="160" rx="12" fill="#DCFCE7" stroke="#10B981" stroke-width="2"/>
  <text x="400" y="80" font-size="12" font-weight="700" fill="#1E1B4B" text-anchor="middle">storage · 128 GB</text>
  <text x="400" y="96" font-size="10" fill="#6B7280" text-anchor="middle">remembers permanently</text>
  <rect x="316" y="108" width="168" height="26" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="328" y="125" font-size="11" font-weight="600" fill="#1E1B4B">photos</text>
  <rect x="316" y="142" width="168" height="26" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="328" y="159" font-size="11" font-weight="600" fill="#1E1B4B">installed apps</text>
  <rect x="316" y="176" width="168" height="26" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="328" y="193" font-size="11" font-weight="600" fill="#1E1B4B">saved report</text>
  <path d="M 226 118 Q 262 190 312 186" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#g)"/>
  <text x="268" y="206" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle">save</text>

  </g>
</svg>
