<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="system-ui, sans-serif" role="img" aria-labelledby="clt cld">
  <title id="clt">Cesta fotky „do cloudu“</title>
  <desc id="cld">Fotka putuje z telefonu přes domácí router a internet do datového centra — tam doopravdy leží. Zeleně cesta zpět: stáhnutí na jiném zařízení, třeba notebooku.</desc>
  <defs>
    <marker id="cl-ap" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#7C3AED"/>
    </marker>
    <marker id="cl-ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#10B981"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="518" height="298" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>

  <text x="18" y="25" font-size="18" font-weight="700" fill="#1E1B4B">Cesta fotky „do cloudu“</text>
  <text x="18" y="43" font-size="11" fill="#6B7280">Obláček je ve skutečnosti konkrétní hala plná serverů.</text>

  <!-- popisek datového centra -->
  <rect x="349" y="46" width="154" height="22" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="426" y="61" text-anchor="middle" font-size="11" fill="#1E1B4B">tady fotka doopravdy leží</text>
  <path d="M442 68 L442 74" stroke="#D97706" stroke-width="2"/>

  <!-- Telefon -->
  <rect x="16" y="76" width="80" height="88" rx="10" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="2"/>
  <rect x="41" y="88" width="30" height="50" rx="5" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="2"/>
  <rect x="45" y="93" width="22" height="34" rx="2" fill="#E0F2FE"/>
  <rect x="48" y="100" width="16" height="12" fill="#FFFFFF"/>
  <path d="M48 112 L53 104 L56 108 L59 105 L64 112 Z" fill="#10B981"/>
  <circle cx="60" cy="103" r="1.6" fill="#D97706"/>
  <circle cx="56" cy="132" r="1.5" fill="#E5E7EB"/>
  <text x="56" y="156" text-anchor="middle" font-size="12" font-weight="700" fill="#1E1B4B">Telefon</text>

  <path d="M100 120 L123 120" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#cl-ap)"/>

  <!-- Router -->
  <rect x="127" y="76" width="96" height="88" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
  <path d="M162 108 L156 92 M188 108 L194 92" stroke="#D97706" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="150" y="108" width="50" height="22" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <circle cx="162" cy="119" r="2" fill="#10B981"/>
  <circle cx="172" cy="119" r="2" fill="#10B981"/>
  <circle cx="182" cy="119" r="2" fill="#D97706"/>
  <text x="175" y="156" text-anchor="middle" font-size="12" font-weight="700" fill="#1E1B4B">Router doma</text>

  <path d="M227 120 L250 120" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#cl-ap)"/>

  <!-- Internet: obláček z uzlů -->
  <rect x="254" y="76" width="96" height="88" rx="10" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="2"/>
  <path d="M302 114 L280 102 M302 114 L302 96 M302 114 L324 102 M302 114 L286 132 M302 114 L318 132 M280 102 L302 96 M302 96 L324 102 M286 132 L318 132" stroke="#0EA5E9" stroke-width="1.5"/>
  <circle cx="280" cy="102" r="4" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="1.5"/>
  <circle cx="302" cy="96" r="4" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="1.5"/>
  <circle cx="324" cy="102" r="4" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="1.5"/>
  <circle cx="286" cy="132" r="4" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="1.5"/>
  <circle cx="318" cy="132" r="4" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="1.5"/>
  <circle cx="302" cy="114" r="5" fill="#0EA5E9"/>
  <text x="302" y="156" text-anchor="middle" font-size="12" font-weight="700" fill="#1E1B4B">Internet</text>

  <path d="M354 120 L377 120" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#cl-ap)"/>

  <!-- Datové centrum -->
  <rect x="381" y="76" width="122" height="88" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <rect x="404" y="88" width="76" height="52" rx="3" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <rect x="410" y="94" width="18" height="40" rx="2" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <rect x="413" y="98" width="12" height="6" rx="1" fill="#EDE9FE"/>
  <rect x="413" y="108" width="12" height="6" rx="1" fill="#EDE9FE"/>
  <rect x="413" y="118" width="12" height="6" rx="1" fill="#EDE9FE"/>
  <circle cx="419" cy="129" r="1.8" fill="#10B981"/>
  <rect x="433" y="94" width="18" height="40" rx="2" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <rect x="436" y="98" width="12" height="6" rx="1" fill="#EDE9FE"/>
  <rect x="436" y="108" width="12" height="6" rx="1" fill="#EDE9FE"/>
  <rect x="436" y="118" width="12" height="6" rx="1" fill="#EDE9FE"/>
  <circle cx="442" cy="129" r="1.8" fill="#10B981"/>
  <rect x="456" y="94" width="18" height="40" rx="2" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <rect x="459" y="98" width="12" height="6" rx="1" fill="#EDE9FE"/>
  <rect x="459" y="108" width="12" height="6" rx="1" fill="#EDE9FE"/>
  <rect x="459" y="118" width="12" height="6" rx="1" fill="#EDE9FE"/>
  <circle cx="465" cy="129" r="1.8" fill="#10B981"/>
  <text x="442" y="156" text-anchor="middle" font-size="12" font-weight="700" fill="#1E1B4B">Datové centrum</text>

  <!-- stáhnutí na jiném zařízení -->
  <path d="M442 164 L442 252 L278 252" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#cl-ag)"/>
  <text x="360" y="242" text-anchor="middle" font-size="11" fill="#6B7280">stáhnutí na jiném zařízení</text>

  <!-- Notebook -->
  <rect x="140" y="216" width="130" height="72" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <rect x="185" y="226" width="40" height="26" rx="3" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="2"/>
  <rect x="189" y="230" width="32" height="18" fill="#E0F2FE"/>
  <path d="M189 248 L199 236 L205 243 L210 238 L221 248 Z" fill="#10B981"/>
  <circle cx="215" cy="235" r="2" fill="#D97706"/>
  <path d="M177 252 L233 252 L228 258 L182 258 Z" fill="#E5E7EB"/>
  <text x="205" y="276" text-anchor="middle" font-size="12" font-weight="700" fill="#1E1B4B">Notebook</text>
</svg>
