<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 270" role="img" aria-label="Stejná data, jiný dojem: poctivý graf s osou od nuly a useknutý graf">
  <rect x="1" y="1" width="518" height="268" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>
  <text x="18" y="26" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#1E1B4B">Stejná čísla, jiný dojem</text>
  <text x="18" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">Prodeje: 100 → 102 → 105. Oba grafy říkají „pravdu“ — jen jeden z nich křičí.</text>

  <!-- poctivý -->
  <rect x="26" y="56" width="225" height="176" rx="11" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="138" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#10B981">✓ Poctivý: osa od 0</text>
  <line x1="60" y1="196" x2="230" y2="196" stroke="#6B7280" stroke-width="1.5"/>
  <line x1="60" y1="196" x2="60" y2="92" stroke="#6B7280" stroke-width="1.5"/>
  <text x="52" y="199" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" fill="#6B7280">0</text>
  <text x="52" y="102" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" fill="#6B7280">110</text>
  <rect x="78" y="103" width="36" height="93" fill="#D1FAE5" stroke="#10B981"/>
  <rect x="130" y="101" width="36" height="95" fill="#D1FAE5" stroke="#10B981"/>
  <rect x="182" y="98" width="36" height="98" fill="#D1FAE5" stroke="#10B981"/>
  <g font-family="system-ui, sans-serif" font-size="10" fill="#1E1B4B" text-anchor="middle">
    <text x="96" y="212">100</text><text x="148" y="212">102</text><text x="200" y="212">105</text>
  </g>
  <text x="138" y="226" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#6B7280">dojem: klidný růst o pár %</text>

  <!-- useknutý -->
  <rect x="269" y="56" width="225" height="176" rx="11" fill="#FFFFFF" stroke="#EF4444" stroke-width="2"/>
  <text x="381" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#EF4444">⚠ Useknutý: osa od 99</text>
  <line x1="303" y1="196" x2="473" y2="196" stroke="#6B7280" stroke-width="1.5"/>
  <line x1="303" y1="196" x2="303" y2="92" stroke="#6B7280" stroke-width="1.5"/>
  <text x="295" y="199" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" fill="#EF4444" font-weight="700">99</text>
  <text x="295" y="102" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" fill="#6B7280">106</text>
  <path d="M296 186 l6 -5 l4 5" fill="none" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="321" y="181" width="36" height="15" fill="#FEE2E2" stroke="#EF4444"/>
  <rect x="373" y="151" width="36" height="45" fill="#FEE2E2" stroke="#EF4444"/>
  <rect x="425" y="106" width="36" height="90" fill="#FEE2E2" stroke="#EF4444"/>
  <g font-family="system-ui, sans-serif" font-size="10" fill="#1E1B4B" text-anchor="middle">
    <text x="339" y="212">100</text><text x="391" y="212">102</text><text x="443" y="212">105</text>
  </g>
  <text x="381" y="226" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#6B7280">dojem: RAKETOVÝ RŮST!!!</text>

  <text x="260" y="254" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#1E1B4B" font-weight="600">Než uvěříš grafu, mrkni, kde začíná osa a jaké má měřítko.</text>
</svg>
