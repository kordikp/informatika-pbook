<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" role="img" aria-label="Dvoufaktorové ověření: dva zámky na dveřích k účtu">
  <rect x="1" y="1" width="518" height="258" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>
  <text x="18" y="26" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#1E1B4B">2FA: dva zámky na jedněch dveřích</text>
  <text x="18" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">Ukradené heslo samo nestačí — druhý zámek odemyká jen tvůj telefon.</text>

  <!-- zloděj -->
  <g font-family="system-ui, sans-serif">
    <circle cx="70" cy="120" r="20" fill="#FEE2E2"/>
    <text x="70" y="128" text-anchor="middle" font-size="20">🕵️</text>
    <text x="70" y="158" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">útočník</text>
    <rect x="34" y="168" width="74" height="24" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="71" y="184" text-anchor="middle" font-size="10" fill="#6B7280">🔑 ukradené heslo</text>
  </g>

  <!-- zámek 1 -->
  <g font-family="system-ui, sans-serif">
    <rect x="150" y="76" width="120" height="130" rx="11" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <circle cx="210" cy="112" r="18" fill="#EDE9FE"/>
    <text x="210" y="119" text-anchor="middle" font-size="17">🔒</text>
    <text x="210" y="146" text-anchor="middle" font-size="12" font-weight="700" fill="#1E1B4B">Zámek 1</text>
    <text x="210" y="162" text-anchor="middle" font-size="10.5" fill="#6B7280">heslo</text>
    <text x="210" y="188" text-anchor="middle" font-size="11" fill="#10B981" font-weight="700">odemkl ✓</text>
  </g>

  <!-- zámek 2 -->
  <g font-family="system-ui, sans-serif">
    <rect x="286" y="76" width="120" height="130" rx="11" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <circle cx="346" cy="112" r="18" fill="#D1FAE5"/>
    <text x="346" y="119" text-anchor="middle" font-size="17">📲</text>
    <text x="346" y="146" text-anchor="middle" font-size="12" font-weight="700" fill="#1E1B4B">Zámek 2</text>
    <text x="346" y="162" text-anchor="middle" font-size="10.5" fill="#6B7280">kód z tvého telefonu</text>
    <rect x="308" y="172" width="76" height="22" rx="5" fill="#D1FAE5"/>
    <text x="346" y="187" text-anchor="middle" font-size="12" font-weight="700" fill="#1E1B4B">482 913</text>
  </g>

  <!-- účet -->
  <g font-family="system-ui, sans-serif">
    <rect x="422" y="76" width="80" height="130" rx="11" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <text x="462" y="128" text-anchor="middle" font-size="20">👤</text>
    <text x="462" y="152" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1E1B4B">Tvůj účet</text>
    <text x="462" y="168" text-anchor="middle" font-size="10" fill="#6B7280">e-mail, fotky…</text>
  </g>

  <!-- stop -->
  <circle cx="278" cy="141" r="15" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
  <path d="M270 133 L286 149 M286 133 L270 149" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
  <text x="278" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1E1B4B">Bez tvého telefonu útočník dál neprojde — proto zapni 2FA aspoň na e-mailu a sítích.</text>
</svg>
