<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" font-family="system-ui,sans-serif" role="img" aria-label="Komiks: Hledání chyby v programu jako detektivka s lupou">
  <rect width="800" height="640" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#1E1B4B">Elementární, milý print()</text>

  <!-- P1: příznak -->
  <rect x="14" y="56" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="40" y="72" width="220" height="58" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <path d="M84 130 L76 152 L110 130 Z" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="150" y="94" text-anchor="middle" font-size="13" fill="#1E1B4B">Nefunguje to!</text>
  <text x="150" y="114" text-anchor="middle" font-size="13" fill="#1E1B4B">Mám v programu brouka!</text>
  <circle cx="80" cy="188" r="22" fill="#FEF3C7"/>
  <text x="80" y="196" text-anchor="middle" font-size="22">😫</text>
  <path d="M66 218 Q80 210 94 218 L98 264 L62 264 Z" fill="#7C3AED"/>
  <rect x="180" y="150" width="180" height="110" rx="8" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="2"/>
  <rect x="192" y="162" width="156" height="86" rx="4" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="270" y="182" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">HRA: Lovec mincí</text>
  <circle cx="216" cy="204" r="9" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="232" y="209" font-size="11" fill="#1E1B4B">mince +1 bod</text>
  <text x="270" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#EF4444">SKÓRE: 10 ?!</text>
  <text x="344" y="152" font-size="16">🐞</text>
  <text x="204" y="306" text-anchor="middle" font-size="12" fill="#6B7280">Příznak: jedna mince, deset bodů. Příčina: zatím neznámá.</text>

  <!-- P2: stopování s print() -->
  <rect x="406" y="56" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="426" y="64" width="150" height="30" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <text x="501" y="84" text-anchor="middle" font-size="12" fill="#1E1B4B">Hmm, čerstvé stopy…</text>
  <path d="M462 94 L456 114 L486 94 Z" fill="#FFFFFF" stroke="#E5E7EB"/>
  <circle cx="452" cy="140" r="22" fill="#FEF3C7"/>
  <text x="452" y="148" text-anchor="middle" font-size="22">🕵️</text>
  <path d="M438 170 Q452 162 466 170 L470 216 L434 216 Z" fill="#D97706"/>
  <circle cx="508" cy="196" r="24" fill="#E0F2FE" stroke="#1E1B4B" stroke-width="2.5"/>
  <line x1="526" y1="214" x2="548" y2="238" stroke="#1E1B4B" stroke-width="5" stroke-linecap="round"/>
  <text x="530" y="110" font-size="14">🐾</text>
  <text x="560" y="152" font-size="14">🐾</text>
  <rect x="556" y="88" width="136" height="26" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="624" y="105" text-anchor="middle" font-size="11" fill="#1E1B4B">print: skore = 0</text>
  <rect x="584" y="132" width="136" height="26" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="652" y="149" text-anchor="middle" font-size="11" fill="#1E1B4B">print: skore = 0</text>
  <rect x="612" y="176" width="150" height="26" rx="6" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
  <text x="687" y="193" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">print: skore = 10</text>
  <text x="687" y="224" text-anchor="middle" font-size="11.5" font-weight="700" fill="#EF4444">← tady se to zvrtlo!</text>
  <text x="596" y="306" text-anchor="middle" font-size="12" fill="#6B7280">print() jsou stopy: kde se čísla rozejdou s očekáváním?</text>

  <!-- P3: viník pod lupou -->
  <rect x="14" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="40" y="360" width="150" height="92" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="115" y="378" text-anchor="middle" font-size="11" fill="#6B7280">hra.py</text>
  <rect x="54" y="390" width="100" height="8" rx="3" fill="#E5E7EB"/>
  <rect x="54" y="404" width="120" height="8" rx="3" fill="#E5E7EB"/>
  <rect x="54" y="418" width="90" height="8" rx="3" fill="#FEF3C7" stroke="#D97706"/>
  <rect x="54" y="432" width="110" height="8" rx="3" fill="#E5E7EB"/>
  <line x1="146" y1="422" x2="180" y2="434" stroke="#D97706" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="40" y="470" width="138" height="24" rx="6" fill="#D1FAE5"/>
  <text x="109" y="486" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">půlka kódu nevinná ✓</text>
  <g transform="rotate(-3 320 355)">
    <rect x="254" y="342" width="132" height="26" rx="8" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
    <text x="320" y="360" text-anchor="middle" font-size="12.5" font-weight="700" fill="#EF4444">VINÍK: PŘEKLEP</text>
  </g>
  <circle cx="250" cy="444" r="72" fill="#E0F2FE" stroke="#1E1B4B" stroke-width="3"/>
  <text x="242" y="450" text-anchor="middle" font-size="13.5" fill="#1E1B4B">skore = skore + 10</text>
  <circle cx="306" cy="445" r="10" fill="none" stroke="#EF4444" stroke-width="2"/>
  <text x="242" y="482" text-anchor="middle" font-size="11.5" font-weight="700" fill="#EF4444">nula navíc!</text>
  <line x1="301" y1="495" x2="330" y2="526" stroke="#1E1B4B" stroke-width="6" stroke-linecap="round"/>
  <text x="204" y="586" text-anchor="middle" font-size="12" fill="#6B7280">Zužuj okruh podezřelých… viník je jedna nula navíc.</text>

  <!-- P4: oprava a testy -->
  <rect x="406" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="428" y="356" width="184" height="52" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="520" y="378" text-anchor="middle" font-size="13" fill="#1E1B4B">skore = skore + 1</text>
  <text x="520" y="398" text-anchor="middle" font-size="11" font-weight="700" fill="#10B981">✓ opravena příčina</text>
  <rect x="428" y="424" width="184" height="102" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="520" y="444" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1E1B4B">RYCHLÉ TESTY</text>
  <g font-size="11.5" fill="#1E1B4B">
    <text x="444" y="466">1 mince → 1 bod ✓</text>
    <text x="444" y="486">0 mincí → 0 bodů ✓</text>
    <text x="444" y="506">100 mincí → 100 ✓</text>
  </g>
  <rect x="636" y="352" width="140" height="58" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <path d="M690 410 L698 424 L722 410 Z" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="706" y="374" text-anchor="middle" font-size="12.5" fill="#1E1B4B">Případ uzavřen!</text>
  <text x="706" y="392" text-anchor="middle" font-size="12.5" fill="#1E1B4B">Brouk za mřížemi.</text>
  <circle cx="700" cy="446" r="22" fill="#FEF3C7"/>
  <text x="700" y="454" text-anchor="middle" font-size="22">😎</text>
  <path d="M686 476 Q700 468 714 476 L718 520 L682 520 Z" fill="#D97706"/>
  <circle cx="650" cy="542" r="20" fill="#FFFFFF" stroke="#EF4444" stroke-width="2.5"/>
  <text x="650" y="549" text-anchor="middle" font-size="16">🐞</text>
  <line x1="636" y1="528" x2="664" y2="556" stroke="#EF4444" stroke-width="2.5"/>
  <text x="596" y="586" text-anchor="middle" font-size="12" fill="#6B7280">Oprav příčinu, ne příznak — a otestuj i záludné případy.</text>

  <text x="400" y="626" text-anchor="middle" font-size="13" fill="#6B7280">Ladění = vystopovat příčinu chyby, ne jen příznak. Testování = ověřit program dřív, než selže.</text>
</svg>
