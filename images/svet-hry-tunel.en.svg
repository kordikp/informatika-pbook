<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" role="img" aria-label="Pomalý míček se odrazí, rychlý pálku přeskočí">
  <defs><marker id="a" viewBox="0 0 10 10" markerWidth="4.5" markerHeight="4.5" refX="7" refY="5" orient="auto"><path d="M0 1 L10 5 L0 9 L2 5 Z" fill="#7C3AED"/></marker><marker id="g" viewBox="0 0 10 10" markerWidth="4.5" markerHeight="4.5" refX="7" refY="5" orient="auto"><path d="M0 1 L10 5 L0 9 L2 5 Z" fill="#10B981"/></marker></defs>
  <rect x="1" y="1" width="518" height="258" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>
  <g font-family="system-ui, sans-serif">
  <text x="18" y="26" font-size="17" font-weight="700" fill="#1E1B4B">A fast ball flies through the paddle</text>
  <text x="18" y="44" font-size="11" fill="#6B7280">The game checks for collisions once per frame. Between frames, nobody sees the ball.</text>
  <text x="24" y="102" font-size="13" font-weight="700" fill="#1E1B4B">speed 3</text>
  <text x="24" y="118" font-size="10" fill="#6B7280">pixels per frame</text>
  <rect x="300" y="70" width="10" height="68" rx="3" fill="#7C3AED"/>
  <text x="305" y="65" font-size="9" fill="#6B7280" text-anchor="middle">paddle</text>
  <circle cx="278" cy="104" r="7" fill="#F59E0B" opacity="0.35"/>
  <circle cx="288" cy="104" r="7" fill="#F59E0B" opacity="0.65"/>
  <circle cx="298" cy="104" r="7" fill="#F59E0B" opacity="0.95"/>
  <text x="496" y="109" font-size="14" font-weight="700" fill="#10B981" text-anchor="end">✓ bounces back</text>
  <text x="24" y="180" font-size="13" font-weight="700" fill="#1E1B4B">speed 40</text>
  <text x="24" y="196" font-size="10" fill="#6B7280">pixels per frame</text>
  <rect x="300" y="148" width="10" height="68" rx="3" fill="#7C3AED"/>
  <text x="305" y="143" font-size="9" fill="#6B7280" text-anchor="middle">paddle</text>
  <line x1="232" y1="182" x2="362" y2="182" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="3 4"/>
  <circle cx="232" cy="182" r="7" fill="#F59E0B" opacity="0.35"/>
  <text x="232" y="230" font-size="9" fill="#6B7280" text-anchor="middle">frame 1</text>
  <circle cx="277" cy="182" r="7" fill="#F59E0B" opacity="0.65"/>
  <text x="277" y="230" font-size="9" fill="#6B7280" text-anchor="middle">frame 2</text>
  <circle cx="322" cy="182" r="7" fill="#F59E0B" opacity="0.95"/>
  <text x="322" y="230" font-size="9" fill="#6B7280" text-anchor="middle">frame 3</text>
  <text x="496" y="187" font-size="14" font-weight="700" fill="#EF4444" text-anchor="end">✗ flies through</text>
  <text x="260" y="246" font-size="10" fill="#6B7280" text-anchor="middle">Test in advance: speed 3 → bounces back. Speed 40 → bounces back. The second test fails.</text>

  </g>
</svg>
