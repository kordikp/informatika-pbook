<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" font-family="system-ui,sans-serif">
  <rect width="800" height="640" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="38" font-size="21" font-weight="700" fill="#1E1B4B" text-anchor="middle">Na vlastní palec antivir neplatí</text>

  <rect x="14" y="56" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="406" y="56" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="14" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="406" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- Panel 1 -->
  <rect x="104" y="76" width="272" height="58" rx="9" fill="#E0F2FE" stroke="#0EA5E9"/>
  <text x="122" y="98" font-size="12.5" fill="#1E1B4B">
    <tspan x="122" y="98">Pošli mi intimní fotku.</tspan>
    <tspan x="122" y="117">Fakt to zůstane mezi námi.</tspan>
  </text>
  <circle cx="69" cy="164" r="10" fill="#7C3AED"/>
  <path d="M69 175 L69 229 M69 188 L104 202 M69 228 L51 258 M69 228 L87 258" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="104" y="185" width="66" height="82" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <path d="M122 205 H152 M122 220 H145 M122 235 H151" fill="none" stroke="#7C3AED" stroke-width="2" stroke-linecap="round"/>
  <text x="204" y="306" font-size="12" fill="#6B7280" text-anchor="middle">Neznámý profil zkouší, kam až pustíš zvědavost.</text>

  <!-- Panel 2 -->
  <rect x="496" y="76" width="273" height="44" rx="9" fill="#D1FAE5" stroke="#10B981"/>
  <text x="632.5" y="103" font-size="12.5" fill="#1E1B4B" text-anchor="middle">ANTIVIR: Telefon je čistý.</text>
  <circle cx="467" cy="171" r="10" fill="#7C3AED"/>
  <path d="M467 182 L467 236 M467 194 L507 208 M467 236 L450 266 M467 236 L485 266" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="507" y="187" width="66" height="82" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="540" y="231" font-size="21" font-weight="700" fill="#7C3AED" text-anchor="middle">?</text>
  <path d="M660 157 L709 157 L704 205 Q699 235 684.5 246 Q670 235 665 205 Z" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  <path d="M673 199 L682 208 L698 186" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
  <text x="596" y="306" font-size="12" fill="#6B7280" text-anchor="middle">Telefon je čistý. Situace zatím rozhodně ne.</text>

  <!-- Panel 3 -->
  <rect x="42" y="356" width="323" height="55" rx="9" fill="#FEE2E2" stroke="#EF4444"/>
  <text x="203.5" y="378" font-size="12.5" fill="#1E1B4B" text-anchor="middle">
    <tspan x="203.5" y="378">No tak. Jen jednu.</tspan>
    <tspan x="203.5" y="397">Nebo mi nevěříš?</tspan>
  </text>
  <circle cx="80" cy="458" r="10" fill="#7C3AED"/>
  <path d="M80 469 L80 523 M80 482 L116 493 M80 523 L62 553 M80 523 L98 553" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="186" y="526" width="176" height="18" rx="5" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <path d="M202 526 L233 474 L269 526 M269 526 L304 474 L346 526" fill="none" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
  <circle cx="326" cy="508" r="15" fill="none" stroke="#D97706" stroke-width="3"/>
  <rect x="225" y="492" width="86" height="28" rx="7" fill="#FEE2E2" stroke="#EF4444"/>
  <text x="268" y="511" font-size="12.5" font-weight="700" fill="#EF4444" text-anchor="middle">ODESLAT</text>
  <text x="204" y="586" font-size="12" fill="#6B7280" text-anchor="middle">Nátlak a slib tajemství jsou zuby stejné pasti.</text>

  <!-- Panel 4 -->
  <rect x="428" y="358" width="150" height="46" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="503" y="387" font-size="12.5" fill="#1E1B4B" text-anchor="middle">Díky, antivire.</text>
  <rect x="660" y="374" width="104" height="42" rx="9" fill="#D1FAE5" stroke="#10B981"/>
  <text x="712" y="400" font-size="12.5" fill="#1E1B4B" text-anchor="middle">Za co?</text>
  <circle cx="471" cy="470" r="10" fill="#7C3AED"/>
  <path d="M471 481 L471 530 M471 493 L527 489 M471 530 L454 558 M471 530 L489 558" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="527" y="455" width="108" height="76" rx="8" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2"/>
  <text x="581" y="485" font-size="12.5" font-weight="700" fill="#10B981" text-anchor="middle">
    <tspan x="581" y="485">BLOKOVÁNO</tspan>
    <tspan x="581" y="505">A NAHLÁŠENO</tspan>
  </text>
  <path d="M683 451 L735 451 L730 501 Q725 530 709 542 Q693 530 688 501 Z" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  <text x="596" y="586" font-size="12" fill="#6B7280" text-anchor="middle">Blokování a nahlášení nechají past sklapnout naprázdno.</text>

  <text x="400" y="626" font-size="13" fill="#6B7280" text-anchor="middle">Bezpečně se chováš, když poznáš past, chráníš soukromí a intimní fotky nikdy neposíláš.</text>
</svg>