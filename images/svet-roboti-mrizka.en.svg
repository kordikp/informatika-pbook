  <rect x="144" y="100" width="40" height="40" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="184" y="100" width="40" height="40" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="24" y="140" width="40" height="40" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="64" y="140" width="40" height="40" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="104" y="140" width="40" height="40" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="144" y="140" width="40" height="40" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="184" y="140" width="40" height="40" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="24" y="180" width="40" height="40" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
