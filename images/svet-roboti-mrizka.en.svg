  <polyline points="44,200 44,80 164,80" fill="none" stroke="#7C3AED" stroke-width="4" stroke-linejoin="round" opacity=".85" marker-end="url(#a)"/>
  <polyline points="44,200 164,200 164,96" fill="none" stroke="#10B981" stroke-width="4" stroke-dasharray="7 5" stroke-linejoin="round" marker-end="url(#g)"/>
  <text x="44" y="212" font-size="24" fill="#1E1B4B" text-anchor="middle">🤖</text>
  <text x="164" y="90" font-size="22" fill="#1E1B4B" text-anchor="middle">🔋</text>
  <text x="250" y="76" font-size="12" font-weight="700" fill="#7C3AED">Path A</text>
  <text x="250" y="96" font-size="10.5" fill="#1E1B4B">move forward 3×</text>
  <text x="250" y="112" font-size="10.5" fill="#1E1B4B">turn right 90°</text>
  <text x="250" y="128" font-size="10.5" fill="#1E1B4B">move forward 3×</text>
  <text x="250" y="144" font-size="10.5" fill="#1E1B4B">stop</text>
  <text x="384" y="76" font-size="12" font-weight="700" fill="#10B981">Path B</text>
  <text x="384" y="96" font-size="10.5" fill="#1E1B4B">turn right 90°</text>
  <text x="384" y="112" font-size="10.5" fill="#1E1B4B">move forward 3×</text>
  <text x="384" y="128" font-size="10.5" fill="#1E1B4B">turn left 90°</text>
  <text x="384" y="144" font-size="10.5" fill="#1E1B4B">move forward 3×</text>
  <text x="384" y="160" font-size="10.5" fill="#1E1B4B">stop</text>
  <text x="250" y="200" font-size="11" font-weight="600" fill="#1E1B4B">✓ unambiguous   ✓ finite</text>
  <text x="250" y="218" font-size="11" font-weight="600" fill="#1E1B4B">✓ general   ✓ correct</text>
  <text x="260" y="246" font-size="10" fill="#6B7280" text-anchor="middle">At the start the robot faces up. Both paths end exactly on the charger.</text>

