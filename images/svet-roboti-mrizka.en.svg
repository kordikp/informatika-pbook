<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" role="img" aria-label="Robot na mřížce a dvě cesty k nabíječce">
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#7C3AED"/></marker><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#10B981"/></marker></defs>
  <rect x="1" y="1" width="518" height="258" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>
  <g font-family="system-ui, sans-serif">
  <text x="18" y="26" font-size="17" font-weight="700" fill="#1E1B4B">Two paths to the charger</text>
  <text x="18" y="44" font-size="11" fill="#6B7280">The robot can only: move one square, turn 90°, stop. And it does it literally.</text>
  <rect x="24" y="60" width="40" height="40" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="64" y="60" width="40" height="40" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="104" y="60" width="40" height="40" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="144" y="60" width="40" height="40" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="184" y="60" width="40" height="40" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="24" y="100" width="40" height="40" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="64" y="100" width="40" height="40" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
