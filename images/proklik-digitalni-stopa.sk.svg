<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-label="Tři obyčejné příspěvky smyšlené Kláry a co z nich krok za krokem zjistí detektiv">
  <rect x="1" y="1" width="518" height="298" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>
  <text x="18" y="26" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#1E1B4B">Čo prezradia tri obyčajné príspevky</text>
  <text x="18" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">Klára je vymyslená. Každá stopa sama je nevinná, spolu povedia veľa.</text>

  <!-- příspěvky -->
  <g font-family="system-ui, sans-serif" font-size="11" fill="#1E1B4B">
    <rect x="14" y="56" width="228" height="70" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="30" cy="72" r="8" fill="#FBCFE8"/><text x="30" y="75.5" text-anchor="middle" font-size="9" font-weight="700" fill="#9D174D">K</text>
    <text x="44" y="76" font-weight="700">klara.hradobna.2012</text>
    <text x="24" y="96">Zase deviatkou do školy,</text>
    <text x="24" y="112">každý deň o 7:40 🚋</text>

    <rect x="14" y="134" width="228" height="70" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="30" cy="150" r="8" fill="#FBCFE8"/><text x="30" y="153.5" text-anchor="middle" font-size="9" font-weight="700" fill="#9D174D">K</text>
    <text x="44" y="154" font-weight="700">klara.hradobna.2012</text>
    <text x="24" y="174">Konečne vlastná izba!</text>
    <text x="24" y="190">Ten výhľad 😍</text>

    <rect x="14" y="212" width="228" height="70" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="30" cy="228" r="8" fill="#FBCFE8"/><text x="30" y="231.5" text-anchor="middle" font-size="9" font-weight="700" fill="#9D174D">K</text>
    <text x="44" y="232" font-weight="700">klara.hradobna.2012</text>
    <text x="24" y="252">Od zajtra týždeň s rodinou pri mori,</text>
    <text x="24" y="268">doma nikto nebude 🏖️</text>
  </g>

  <!-- fotka výlohy: v odrazu je škola -->
  <rect x="174" y="63" width="60" height="56" rx="6" fill="#E0F2FE"/>
  <path d="M174 100 L200 63 M188 119 L226 63" stroke="#FFFFFF" stroke-width="5" opacity=".7"/>
  <rect x="178" y="96" width="52" height="15" rx="2" fill="#1E3A8A" opacity=".75"/>
  <text x="204" y="107" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#FFFFFF">ZŠ Hradobná</text>
  <!-- fotka z okna: cedule s ulicí -->
  <rect x="174" y="141" width="60" height="56" rx="6" fill="#BFDBFE"/>
  <path d="M174 197 V172 H186 V160 H200 V176 H214 V166 H234 V197 Z" fill="#94A3B8"/>
  <rect x="181" y="146" width="40" height="13" rx="2" fill="#1D4ED8"/>
  <text x="201" y="155.5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#FFFFFF">Mlynská</text>

  <!-- zápisník detektiva -->
  <rect x="254" y="56" width="252" height="226" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="268" y="78" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#92400E">🕵️ Detektív zistil:</text>

  <g font-family="system-ui, sans-serif" font-size="11" fill="#1E1B4B">
    <g data-krok="1">
      <rect x="40" y="65" width="126" height="16" rx="4" fill="none" stroke="#F59E0B" stroke-width="2"/>
      <circle cx="172" cy="73" r="7" fill="#F59E0B"/><text x="172" y="76.5" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">1</text>
      <circle cx="274" cy="99" r="7" fill="#F59E0B"/><text x="274" y="102.5" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">1</text>
      <text x="286" y="103">Volá sa Klára, narodila sa v roku</text>
      <text x="286" y="117">2012 a chodí asi na ZŠ Hradobná.</text>
    </g>
    <g data-krok="2">
      <rect x="171" y="60" width="66" height="62" rx="7" fill="none" stroke="#F59E0B" stroke-width="2"/>
      <rect x="20" y="100" width="150" height="17" rx="4" fill="none" stroke="#F59E0B" stroke-width="2"/>
      <circle cx="237" cy="60" r="7" fill="#F59E0B"/><text x="237" y="63.5" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">2</text>
      <circle cx="274" cy="137" r="7" fill="#F59E0B"/><text x="274" y="140.5" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">2</text>
      <text x="286" y="141">Škola je istá, je v odraze výkladu.</text>
      <text x="286" y="155">Každý všedný deň o 7:40 je na ceste.</text>
    </g>
    <g data-krok="3">
      <rect x="171" y="138" width="66" height="62" rx="7" fill="none" stroke="#F59E0B" stroke-width="2"/>
      <rect x="180" y="181" width="50" height="14" rx="7" fill="#EF4444"/>
      <text x="205" y="191.5" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">📍 GPS</text>
      <circle cx="237" cy="138" r="7" fill="#F59E0B"/><text x="237" y="141.5" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">3</text>
      <circle cx="274" cy="175" r="7" fill="#F59E0B"/><text x="274" y="178.5" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">3</text>
      <text x="286" y="179">Býva na Mlynskej. Originál fotky</text>
      <text x="286" y="193">nesie polohu presnú na pár metrov.</text>
    </g>
    <g data-krok="4">
      <rect x="19" y="239" width="214" height="36" rx="6" fill="none" stroke="#F59E0B" stroke-width="2"/>
      <circle cx="237" cy="239" r="7" fill="#F59E0B"/><text x="237" y="242.5" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">4</text>
      <circle cx="274" cy="213" r="7" fill="#F59E0B"/><text x="274" y="216.5" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">4</text>
      <text x="286" y="217">Celý budúci týždeň bude byt prázdny.</text>
    </g>
    <g data-krok="5">
      <rect x="264" y="230" width="232" height="44" rx="8" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
      <text x="276" y="248" font-weight="700" fill="#B91C1C">Spolu je to mapa jej života:</text>
      <text x="276" y="264" fill="#B91C1C">kto je, kde býva a kedy nie je doma.</text>
    </g>
  </g>
</svg>
