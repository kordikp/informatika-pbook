  <text x="396" y="86" font-size="9" font-weight="700" fill="#7C3AED" text-anchor="middle">len nevrátené</text>
  <rect x="352" y="100" width="136" height="40" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2"/>
  <text x="360" y="116" font-size="10" font-weight="700" fill="#1E1B4B">Hobit</text>
  <text x="360" y="131" font-size="9" fill="#6B7280">Ondro · 3. 11.</text>
  <rect x="352" y="146" width="136" height="40" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2"/>
  <text x="360" y="162" font-size="10" font-weight="700" fill="#1E1B4B">Malý princ</text>
  <text x="360" y="177" font-size="9" fill="#6B7280">Ema · 4. 11.</text>
  <rect x="352" y="192" width="136" height="40" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2"/>
  <text x="360" y="208" font-size="10" font-weight="700" fill="#1E1B4B">Deti z Bullerbynu</text>
