<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" role="img" aria-label="Tabulka výpůjček a appka, která z ní vznikla">
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#7C3AED"/></marker><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#10B981"/></marker><marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#EF4444"/></marker><marker id="s" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#9CA3AF"/></marker></defs>
  <rect x="1" y="1" width="518" height="258" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>
  <g font-family="system-ui, sans-serif">
  <text x="18" y="26" font-size="17" font-weight="700" fill="#1E1B4B">Z tabuľky apka</text>
  <text x="18" y="44" font-size="11" fill="#6B7280">Riadok je jedna výpožička, stĺpec jedna vlastnosť. Apka z riadkov urobí kartičky.</text>
  <rect x="16" y="58" width="250" height="22" rx="4" fill="#EDE9FE"/>
  <text x="24" y="73" font-size="10" font-weight="700" fill="#1E1B4B">kniha</text>
  <text x="110" y="73" font-size="10" font-weight="700" fill="#1E1B4B">žiak</text>
  <text x="160" y="73" font-size="10" font-weight="700" fill="#1E1B4B">požičal</text>
  <text x="214" y="73" font-size="10" font-weight="700" fill="#1E1B4B">vrátené</text>
  <rect x="16" y="82" width="250" height="24" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="24" y="98" font-size="10" fill="#1E1B4B">Hobit</text>
  <text x="110" y="98" font-size="10" fill="#1E1B4B">Ondro</text>
  <text x="160" y="98" font-size="10" fill="#1E1B4B">3. 11.</text>
  <text x="214" y="98" font-size="10" fill="#1E1B4B">nie</text>
  <text x="24" y="124" font-size="10" fill="#1E1B4B">Malý princ</text>
  <text x="110" y="124" font-size="10" fill="#1E1B4B">Ema</text>
  <text x="160" y="124" font-size="10" fill="#1E1B4B">4. 11.</text>
  <text x="214" y="124" font-size="10" fill="#1E1B4B">nie</text>
  <text x="24" y="150" font-size="10" fill="#1E1B4B">Bolo nás päť</text>
  <text x="110" y="150" font-size="10" fill="#1E1B4B">Kubo</text>
  <text x="160" y="150" font-size="10" fill="#1E1B4B">28. 10.</text>
  <text x="214" y="150" font-size="10" fill="#1E1B4B">áno</text>
  <text x="24" y="176" font-size="10" fill="#1E1B4B">Deti z Bullerbynu</text>
  <text x="110" y="176" font-size="10" fill="#1E1B4B">Eva</text>
  <text x="160" y="176" font-size="10" fill="#1E1B4B">1. 11.</text>
  <text x="214" y="176" font-size="10" fill="#1E1B4B">nie</text>
  <rect x="152" y="58" width="52" height="128" rx="4" fill="none" stroke="#0EA5E9" stroke-width="2"/>
  <text x="100" y="206" font-size="10" font-weight="700" fill="#D97706" text-anchor="middle">riadok = záznam</text>
  <text x="178" y="222" font-size="10" font-weight="700" fill="#0EA5E9" text-anchor="middle">stĺpec = vlastnosť</text>
  <line x1="272" y1="130" x2="330" y2="130" stroke="#7C3AED" stroke-width="2" marker-end="url(#a)"/>
  <rect x="340" y="54" width="160" height="196" rx="14" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="2"/>
  <rect x="408.0" y="60" width="24" height="4" rx="2" fill="#9CA3AF"/>
