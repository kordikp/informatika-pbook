<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 304" role="img" aria-label="Kuchyně v počítači: aplikace putují ze spíže na desku, deska se zaplní a po výpadku proudu je prázdná">
  <defs>
    <marker id="kuB" viewBox="0 0 10 10" markerWidth="4.5" markerHeight="4.5" refX="7" refY="5" orient="auto"><path d="M0 1 L10 5 L0 9 L2 5 Z" fill="#3B82F6"/></marker>
    <marker id="kuR" viewBox="0 0 10 10" markerWidth="4.5" markerHeight="4.5" refX="7" refY="5" orient="auto"><path d="M0 1 L10 5 L0 9 L2 5 Z" fill="#EF4444"/></marker>
  </defs>
  <rect x="1" y="1" width="518" height="302" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>
  <text x="18" y="26" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#1E1B4B">Konyha a számítógépben</text>
  <text x="18" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">A szakács a processzor, a munkapult a memória, a kamra a tárhely.</text>

  <!-- vedoucí směny a kuchař -->
  <g font-family="system-ui, sans-serif">
    <rect x="18" y="54" width="236" height="38" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="28" y="70" font-size="11" font-weight="700" fill="#1E1B4B">📋 Műszakvezető = operációs rendszer</text>
    <text x="28" y="85" font-size="10" fill="#6B7280">eldönti, mi kerül a pultra</text>
    <rect x="266" y="54" width="236" height="38" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="276" y="70" font-size="11" font-weight="700" fill="#1E1B4B">🧑‍🍳 Szakács = processzor</text>
    <text x="276" y="85" font-size="10" fill="#6B7280">azzal számol, ami a pulton van</text>
  </g>

  <!-- pracovní deska -->
  <text x="18" y="109" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1E1B4B">🍽️ Munkapult = memória</text>
  <text x="502" y="109" text-anchor="end" font-family="system-ui, sans-serif" font-size="10" fill="#6B7280">gyors és kicsi, áram nélkül felejt</text>
  <rect x="18" y="114" width="422" height="56" rx="8" fill="#FFF7ED" stroke="#F59E0B" stroke-width="1.5"/>
  <g fill="#FFFFFF" stroke="#FED7AA" stroke-dasharray="3 3">
    <rect x="26" y="121" width="65" height="42" rx="5"/><rect x="95" y="121" width="65" height="42" rx="5"/><rect x="164" y="121" width="65" height="42" rx="5"/>
    <rect x="233" y="121" width="65" height="42" rx="5"/><rect x="302" y="121" width="65" height="42" rx="5"/><rect x="371" y="121" width="65" height="42" rx="5"/>
  </g>

  <!-- spíž -->
  <rect x="18" y="196" width="484" height="44" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#1E1B4B" text-anchor="middle">
    <rect x="26" y="203" width="110" height="30" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/><text x="81" y="222">🎮 Játék</text>
    <rect x="144" y="203" width="110" height="30" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/><text x="199" y="222">🖼️ Fotók</text>
    <rect x="262" y="203" width="110" height="30" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/><text x="317" y="222">🌐 Böngésző</text>
    <rect x="380" y="203" width="114" height="30" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/><text x="437" y="222">📄 Kiselőadás</text>
  </g>
  <text x="18" y="256" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1E1B4B">🗄️ Kamra = tárhely</text>
  <text x="502" y="256" text-anchor="end" font-family="system-ui, sans-serif" font-size="10" fill="#6B7280">nagy, áram nélkül is megőriz mindent</text>

  <!-- krok 1: hra a referát na desce -->
  <g data-krok="1" data-until="4" font-family="system-ui, sans-serif" text-anchor="middle">
    <rect x="26" y="121" width="203" height="42" rx="5" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="127.5" y="146" font-size="12" font-weight="700" fill="#1D4ED8">🎮 Játék</text>
    <rect x="233" y="121" width="65" height="42" rx="5" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="265.5" y="140" font-size="11" font-weight="700" fill="#047857">📄</text>
    <text x="265.5" y="155" font-size="10" font-weight="700" fill="#047857">+3 mondat</text>
  </g>
  <g data-krok="1" data-until="3" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#kuB)">
    <path d="M81 200 V176"/>
    <path d="M430 200 L282 174"/>
  </g>

  <!-- krok 2: 40 záložek a plná deska -->
  <g data-krok="2" data-until="4" font-family="system-ui, sans-serif" text-anchor="middle">
    <rect x="302" y="121" width="134" height="42" rx="5" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="369" y="146" font-size="11" font-weight="700" fill="#92400E">🌐 40 lap</text>
    <rect x="448" y="121" width="54" height="42" rx="5" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="475" y="139" font-size="12">🌐</text>
    <text x="475" y="156" font-size="10" font-weight="700" fill="#EF4444">tele!</text>
    <g fill="none" stroke="#EF4444" stroke-width="2">
      <path d="M468 166 V190" marker-end="url(#kuR)"/>
      <path d="M482 192 V168" marker-end="url(#kuR)"/>
    </g>
  </g>

  <!-- krok 3: výpadek proudu -->
  <g data-krok="3" font-family="system-ui, sans-serif">
    <text x="229" y="147" text-anchor="middle" font-size="12" font-weight="700" fill="#B91C1C">⚡ Áramszünet: a pult üres</text>
    <rect x="380" y="203" width="114" height="30" rx="5" fill="none" stroke="#10B981" stroke-width="2"/>
    <text x="494" y="192" text-anchor="end" font-size="10" font-weight="700" fill="#047857">✓ a mentett változat megmaradt</text>
  </g>

  <!-- popisek kroku -->
  <rect x="14" y="264" width="492" height="30" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <g font-family="system-ui, sans-serif" font-size="12" fill="#1E1B4B">
    <text x="26" y="284" data-until="2">A pulton 6 hely van. Mi történik, ha alkalmazásokat nyitsz meg?</text>
    <text x="26" y="284" data-krok="1" data-until="3"><tspan font-weight="700">1 ·</tspan> Megnyitsz egy játékot és egy kiselőadást. A kamrából a pultra kerülnek.</text>
    <text x="26" y="284" data-krok="2" data-until="4"><tspan font-weight="700">2 ·</tspan> Hozzáadsz 40 lapot, és a pult megtelik. A pakolás lelassít mindent.</text>
    <text x="26" y="284" data-krok="3"><tspan font-weight="700">3 ·</tspan> Elmegy az áram. Az új mondatok eltűntek, a kamra megmaradt.</text>
  </g>
</svg>
