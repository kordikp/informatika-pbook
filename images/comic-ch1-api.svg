<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" font-family="system-ui,sans-serif">
  <rect width="800" height="640" rx="14" fill="#FAFAF7" stroke="#E5E7EB"/>
  <text x="400" y="38" font-size="21" font-weight="700" fill="#1E1B4B" text-anchor="middle">Počasí z denního menu</text>

  <rect x="14" y="56" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="406" y="56" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="14" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="406" y="336" width="380" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- Panel 1 -->
  <g>
    <rect x="30" y="72" width="144" height="44" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="42" y="99" font-size="12.5" fill="#1E1B4B">Co dnes podáváte?</text>

    <rect x="232" y="72" width="144" height="52" rx="9" fill="#D1FAE5" stroke="#10B981"/>
    <text x="244" y="94" font-size="12.5" fill="#1E1B4B">
      <tspan x="244" y="94">API menu.</tspan>
      <tspan x="244" y="112">Vyber přesně.</tspan>
    </text>

    <rect x="169" y="143" width="92" height="78" rx="6" fill="#FEF3C7" stroke="#D97706"/>
    <text x="215" y="163" font-size="12" font-weight="700" fill="#1E1B4B" text-anchor="middle">API MENU</text>
    <text x="181" y="182" font-size="12" fill="#6B7280">počasí</text>
    <text x="181" y="198" font-size="12" fill="#6B7280">mapa</text>
    <text x="181" y="214" font-size="12" fill="#6B7280">platba</text>

    <g stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" fill="none">
      <circle cx="88" cy="170" r="10" fill="#EDE9FE"/>
      <line x1="88" y1="180" x2="88" y2="218"/>
      <line x1="88" y1="191" x2="118" y2="181"/>
      <line x1="88" y1="218" x2="76" y2="234"/>
      <line x1="88" y1="218" x2="100" y2="234"/>
    </g>

    <g stroke="#10B981" stroke-width="2.5" stroke-linecap="round" fill="none">
      <circle cx="313" cy="170" r="10" fill="#D1FAE5"/>
      <line x1="313" y1="180" x2="313" y2="218"/>
      <line x1="313" y1="191" x2="281" y2="181"/>
      <line x1="313" y1="218" x2="302" y2="234"/>
      <line x1="313" y1="218" x2="324" y2="234"/>
    </g>

    <line x1="35" y1="235" x2="373" y2="235" stroke="#E5E7EB" stroke-width="2.5" stroke-linecap="round"/>
    <text x="204" y="306" font-size="12" fill="#6B7280" text-anchor="middle">API je menu mezi appkou a cizí službou.</text>
  </g>

  <!-- Panel 2 -->
  <g>
    <rect x="422" y="72" width="218" height="44" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="434" y="99" font-size="12.5" fill="#1E1B4B">GET /pocasi?mesto=Brno</text>

    <rect x="652" y="72" width="118" height="44" rx="9" fill="#D1FAE5" stroke="#10B981"/>
    <text x="711" y="99" font-size="12.5" fill="#1E1B4B" text-anchor="middle">Rozumím.</text>

    <rect x="552" y="146" width="104" height="66" rx="6" fill="#E0F2FE" stroke="#0EA5E9"/>
    <text x="604" y="168" font-size="12" font-weight="700" fill="#1E1B4B" text-anchor="middle">OBJEDNÁVKA</text>
    <line x1="566" y1="180" x2="642" y2="180" stroke="#0EA5E9" stroke-width="2"/>
    <line x1="566" y1="193" x2="626" y2="193" stroke="#0EA5E9" stroke-width="2"/>

    <g stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" fill="none">
      <circle cx="476" cy="174" r="10" fill="#EDE9FE"/>
      <line x1="476" y1="184" x2="476" y2="222"/>
      <line x1="476" y1="195" x2="514" y2="181"/>
      <line x1="476" y1="222" x2="464" y2="238"/>
      <line x1="476" y1="222" x2="488" y2="238"/>
    </g>

    <g stroke="#10B981" stroke-width="2.5" stroke-linecap="round" fill="none">
      <circle cx="714" cy="174" r="10" fill="#D1FAE5"/>
      <line x1="714" y1="184" x2="714" y2="222"/>
      <line x1="714" y1="195" x2="670" y2="181"/>
      <line x1="714" y1="222" x2="703" y2="238"/>
      <line x1="714" y1="222" x2="725" y2="238"/>
    </g>

    <line x1="427" y1="239" x2="765" y2="239" stroke="#E5E7EB" stroke-width="2.5" stroke-linecap="round"/>
    <text x="596" y="306" font-size="12" fill="#6B7280" text-anchor="middle">Domluvený zápis říká, jaká data appka chce.</text>
  </g>

  <!-- Panel 3 -->
  <g>
    <rect x="30" y="352" width="150" height="44" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="105" y="379" font-size="12.5" fill="#1E1B4B" text-anchor="middle">Bez teploměru!</text>

    <rect x="230" y="352" width="146" height="44" rx="9" fill="#D1FAE5" stroke="#10B981"/>
    <text x="303" y="379" font-size="12.5" fill="#1E1B4B" text-anchor="middle">Hotovo, prosím.</text>

    <rect x="139" y="423" width="132" height="72" rx="7" fill="#E0F2FE" stroke="#0EA5E9"/>
    <text x="205" y="446" font-size="12" font-weight="700" fill="#1E1B4B" text-anchor="middle">BRNO</text>
    <text x="205" y="470" font-size="18" font-weight="700" fill="#0EA5E9" text-anchor="middle">8 °C</text>
    <text x="205" y="487" font-size="12" fill="#6B7280" text-anchor="middle">déšť</text>

    <g stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" fill="none">
      <circle cx="84" cy="447" r="10" fill="#EDE9FE"/>
      <line x1="84" y1="457" x2="84" y2="499"/>
      <line x1="84" y1="468" x2="122" y2="459"/>
      <line x1="84" y1="499" x2="72" y2="516"/>
      <line x1="84" y1="499" x2="96" y2="516"/>
    </g>

    <g stroke="#10B981" stroke-width="2.5" stroke-linecap="round" fill="none">
      <circle cx="320" cy="447" r="10" fill="#D1FAE5"/>
      <line x1="320" y1="457" x2="320" y2="499"/>
      <line x1="320" y1="468" x2="281" y2="459"/>
      <line x1="320" y1="499" x2="309" y2="516"/>
      <line x1="320" y1="499" x2="331" y2="516"/>
    </g>

    <line x1="128" y1="501" x2="282" y2="501" stroke="#D97706" stroke-width="3" stroke-linecap="round"/>
    <text x="204" y="586" font-size="12" fill="#6B7280" text-anchor="middle">Appka si půjčí data; sama venku nic neměří.</text>
  </g>

  <!-- Panel 4 -->
  <g>
    <rect x="422" y="352" width="140" height="48" rx="9" fill="#FEF3C7" stroke="#D97706"/>
    <text x="492" y="381" font-size="12.5" fill="#1E1B4B" text-anchor="middle">Ty máš teploměr?</text>

    <rect x="574" y="350" width="192" height="58" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="670" y="374" font-size="12.5" fill="#1E1B4B" text-anchor="middle">
      <tspan x="670" y="374">Ne. Ale znám</tspan>
      <tspan x="670" y="393">denní menu.</tspan>
    </text>

    <g stroke="#D97706" stroke-width="2.5" stroke-linecap="round" fill="none">
      <circle cx="470" cy="452" r="10" fill="#FEF3C7"/>
      <line x1="470" y1="462" x2="470" y2="505"/>
      <line x1="470" y1="473" x2="510" y2="466"/>
      <line x1="470" y1="505" x2="458" y2="522"/>
      <line x1="470" y1="505" x2="482" y2="522"/>
    </g>

    <rect x="518" y="432" width="62" height="82" rx="8" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="2"/>
    <rect x="526" y="442" width="46" height="54" rx="4" fill="#E0F2FE" stroke="#0EA5E9"/>
    <text x="549" y="461" font-size="12" font-weight="700" fill="#1E1B4B" text-anchor="middle">BRNO</text>
    <text x="549" y="482" font-size="15" font-weight="700" fill="#0EA5E9" text-anchor="middle">8 °C</text>
    <circle cx="549" cy="505" r="3" fill="#6B7280"/>

    <g stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" fill="none">
      <circle cx="630" cy="452" r="10" fill="#EDE9FE"/>
      <line x1="630" y1="462" x2="630" y2="505"/>
      <line x1="630" y1="473" x2="588" y2="465"/>
      <line x1="630" y1="505" x2="618" y2="522"/>
      <line x1="630" y1="505" x2="642" y2="522"/>
    </g>

    <g stroke="#10B981" stroke-width="2.5" stroke-linecap="round" fill="none">
      <circle cx="725" cy="452" r="10" fill="#D1FAE5"/>
      <line x1="725" y1="462" x2="725" y2="505"/>
      <line x1="725" y1="473" x2="690" y2="464"/>
      <line x1="725" y1="505" x2="714" y2="522"/>
      <line x1="725" y1="505" x2="736" y2="522"/>
    </g>

    <rect x="676" y="430" width="32" height="46" rx="4" fill="#FEF3C7" stroke="#D97706"/>
    <text x="692" y="448" font-size="12" font-weight="700" fill="#1E1B4B" text-anchor="middle">API</text>
    <line x1="683" y1="458" x2="701" y2="458" stroke="#D97706" stroke-width="2"/>
    <line x1="683" y1="466" x2="697" y2="466" stroke="#D97706" stroke-width="2"/>

    <text x="596" y="586" font-size="12" fill="#6B7280" text-anchor="middle">Výsledek je v mobilu, kuchyň zůstává za displejem.</text>
  </g>

  <text x="400" y="626" font-size="13" fill="#6B7280" text-anchor="middle">API je domluvené rozhraní, přes které si programy žádají data či schopnosti jiných služeb.</text>
</svg>