<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" role="img" aria-label="Dekompozice: velký úkol rozložený na malé řešitelné kousky">
  <defs>
    <marker id="dp" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#7C3AED"/></marker>
  </defs>
  <rect x="1" y="1" width="518" height="258" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>
  <text x="18" y="26" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#1E1B4B">Dekompozice: rozlož to na kousky</text>
  <text x="18" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">Velký mlhavý úkol → malé úkoly, které zvládne jeden člověk za odpoledne.</text>

  <!-- velký úkol -->
  <rect x="160" y="58" width="200" height="46" rx="10" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
  <text x="260" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1E1B4B">Vánoční jarmark 😱</text>
  <text x="260" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#6B7280">„Nevím, kde začít…“</text>

  <!-- šipky dolů -->
  <path d="M200 104 C170 120 110 122 78 138" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#dp)"/>
  <path d="M232 104 C215 122 190 124 172 138" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#dp)"/>
  <path d="M260 104 L260 138" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#dp)"/>
  <path d="M288 104 C305 122 330 124 348 138" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#dp)"/>
  <path d="M320 104 C350 120 410 122 442 138" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#dp)"/>

  <!-- malé úkoly -->
  <g font-family="system-ui, sans-serif">
    <rect x="24" y="142" width="88" height="60" rx="9" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="68" y="166" text-anchor="middle" font-size="14">🧁</text>
    <text x="68" y="184" text-anchor="middle" font-size="11" font-weight="600" fill="#1E1B4B">Co prodávat?</text>

    <rect x="120" y="142" width="88" height="60" rx="9" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <text x="164" y="166" text-anchor="middle" font-size="14">🧑‍🤝‍🧑</text>
    <text x="164" y="184" text-anchor="middle" font-size="11" font-weight="600" fill="#1E1B4B">Kdo co vyrobí</text>

    <rect x="216" y="142" width="88" height="60" rx="9" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
    <text x="260" y="166" text-anchor="middle" font-size="14">🖼</text>
    <text x="260" y="184" text-anchor="middle" font-size="11" font-weight="600" fill="#1E1B4B">Plakát</text>

    <rect x="312" y="142" width="88" height="60" rx="9" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="2"/>
    <text x="356" y="166" text-anchor="middle" font-size="14">🏪</text>
    <text x="356" y="184" text-anchor="middle" font-size="11" font-weight="600" fill="#1E1B4B">Stánek</text>

    <rect x="408" y="142" width="88" height="60" rx="9" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="452" y="166" text-anchor="middle" font-size="14">💰</text>
    <text x="452" y="184" text-anchor="middle" font-size="11" font-weight="600" fill="#1E1B4B">Kasa</text>
  </g>

  <!-- fajfky -->
  <g font-family="system-ui, sans-serif" font-size="12" fill="#10B981" font-weight="700">
    <text x="68" y="220" text-anchor="middle">✓ zvládne 1 člověk</text>
    <text x="260" y="220" text-anchor="middle">✓ dá se rozdělit</text>
    <text x="452" y="220" text-anchor="middle">✓ chyba se najde</text>
  </g>
  <text x="260" y="244" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">Stejně se staví hry, appky i YouTube — po kouskách, které do sebe zapadnou.</text>
</svg>
