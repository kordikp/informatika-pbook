<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-label="Herní smyčka: načti vstup, přepočítej svět, vykresli — 60krát za sekundu">
  <defs>
    <marker id="hp" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#7C3AED"/></marker>
  </defs>
  <rect x="1" y="1" width="518" height="298" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>
  <text x="18" y="26" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#1E1B4B">Herní smyčka</text>
  <text x="18" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">Tři fáze pořád dokola — proto se hra hýbe.</text>

  <!-- fáze 1 -->
  <g>
    <rect x="60" y="70" width="130" height="66" rx="11" fill="#FFFFFF" stroke="#10B981" stroke-width="2">
      <animate attributeName="stroke-width" values="2;4;2;2;2;2" dur="3.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="60" y="70" width="130" height="66" rx="11" fill="#D1FAE5" opacity="0.25">
      <animate attributeName="opacity" values="0.55;0.15;0.15;0.15;0.15;0.55" dur="3.6s" repeatCount="indefinite"/>
    </rect>
    <text x="125" y="97" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15">🎮</text>
    <text x="125" y="117" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1E1B4B">1. Načti vstup</text>
    <text x="125" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#6B7280">klávesy · dotyk</text>
  </g>

  <!-- fáze 2 -->
  <g>
    <rect x="330" y="70" width="130" height="66" rx="11" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2">
      <animate attributeName="stroke-width" values="2;2;4;2;2;2" dur="3.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="330" y="70" width="130" height="66" rx="11" fill="#EDE9FE" opacity="0.25">
      <animate attributeName="opacity" values="0.15;0.15;0.55;0.15;0.15;0.15" dur="3.6s" repeatCount="indefinite"/>
    </rect>
    <text x="395" y="97" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15">🧮</text>
    <text x="395" y="117" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1E1B4B">2. Přepočítej svět</text>
    <text x="395" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#6B7280">pohyb · kolize · skóre</text>
  </g>

  <!-- fáze 3 -->
  <g>
    <rect x="195" y="180" width="130" height="66" rx="11" fill="#FFFFFF" stroke="#D97706" stroke-width="2">
      <animate attributeName="stroke-width" values="2;2;2;2;4;2" dur="3.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="195" y="180" width="130" height="66" rx="11" fill="#FEF3C7" opacity="0.25">
      <animate attributeName="opacity" values="0.15;0.15;0.15;0.15;0.55;0.15" dur="3.6s" repeatCount="indefinite"/>
    </rect>
    <text x="260" y="207" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15">🖼</text>
    <text x="260" y="227" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1E1B4B">3. Vykresli</text>
    <text x="260" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#6B7280">nová scéna na obrazovku</text>
  </g>

  <!-- šipky kruhem -->
  <path d="M192 103 L326 103" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#hp)"/>
  <path d="M400 138 C398 162 360 188 330 200" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#hp)"/>
  <path d="M192 208 C150 196 122 166 122 142" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#hp)"/>

  <!-- oběžná tečka -->
  <circle r="6" fill="#7C3AED">
    <animateMotion dur="3.6s" repeatCount="indefinite" path="M125 66 C220 46 320 46 395 66 C430 130 400 170 330 206 C280 232 220 226 180 206 C120 176 95 130 125 66"/>
  </circle>

  <!-- počítadlo -->
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <text x="260" y="146" font-size="13" font-weight="700" fill="#1E1B4B">⟳ 60× za sekundu</text>
    <text x="260" y="161" font-size="9.5" fill="#6B7280">(60 FPS — když nestíhá, hra „seká“)</text>
  </g>

  <!-- běžící postavička dole -->
  <g>
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="16">🏃</text>
    <animateMotion dur="3.6s" repeatCount="indefinite" path="M60 278 L120 278 L180 278 L240 278 L300 278 L360 278 L420 278 L60 278"/>
  </g>
  <text x="260" y="292" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#6B7280">postava se „hýbe“ = každý průchod smyčky ji vykreslí o kousek vedle</text>
</svg>
