<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 290" role="img" aria-labelledby="shTitle shDesc" font-family="system-ui, sans-serif">
  <title id="shTitle">Password strength: seconds or forever</title>
  <desc id="shDesc">The attacker's program tries passwords. The short password dog123 is cracked in a second: the bar runs to the end and the lock gives way. With the long phrase BlueCamelSingsOpera the bar hardly moves, the year counter climbs and the lock holds.</desc>
  <defs>
    <marker id="shArrR" viewBox="0 0 10 10" markerWidth="4.5" markerHeight="4.5" refX="7" refY="5" orient="auto">
      <path d="M0 1 L10 5 L0 9 L2 5 Z" fill="#EF4444"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="518" height="288" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>

  <text x="18" y="25" font-size="18" font-weight="700" fill="#1E1B4B">Password strength: seconds or forever</text>
  <text x="18" y="43" font-size="11" fill="#6B7280">The attacker's program tries combinations by machine. What matters most is length.</text>

  <!-- útočník -->
  <circle cx="52" cy="100" r="22" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
  <text x="52" y="108" text-anchor="middle" font-size="20">🤖</text>
  <text x="52" y="140" text-anchor="middle" font-size="11" fill="#6B7280">attacker's</text>
  <text x="52" y="154" text-anchor="middle" font-size="11" fill="#6B7280">program</text>

  <path d="M76 92 C118 78 138 84 162 94" fill="none" stroke="#EF4444" stroke-width="2" marker-end="url(#shArrR)"/>
  <path d="M76 108 C118 138 138 172 162 196" fill="none" stroke="#EF4444" stroke-width="2" marker-end="url(#shArrR)"/>

  <!-- proud pokusů -->
  <circle r="2.5" fill="#EF4444">
    <animateMotion path="M76 92 C118 78 138 84 162 94" dur="0.7s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.5" fill="#EF4444">
    <animateMotion path="M76 108 C118 138 138 172 162 196" dur="0.85s" repeatCount="indefinite"/>
  </circle>

  <!-- krátké heslo -->
  <rect x="168" y="64" width="330" height="88" rx="10" fill="#FFFFFF" stroke="#EF4444" stroke-width="2"/>
  <rect x="182" y="76" width="90" height="22" rx="6" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="227" y="91" text-anchor="middle" font-size="12" font-weight="700" fill="#1E1B4B">dog123</text>
  <text x="286" y="91" font-size="11" fill="#6B7280">short password</text>
  <rect x="182" y="104" width="240" height="12" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="183" y="105" width="2" height="10" rx="5" fill="#EF4444">
    <animate attributeName="width" values="2;2;238;238" keyTimes="0;0.06;0.20;1" dur="7s" repeatCount="indefinite"/>
  </rect>
  <text x="182" y="140" font-size="11" fill="#6B7280">dictionary attack: done in seconds</text>
  <text x="462" y="124" text-anchor="middle" font-size="18">🔒<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.20;0.22;0.97;1" dur="7s" repeatCount="indefinite"/></text>
  <text x="462" y="124" text-anchor="middle" font-size="18" opacity="0">🔓<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.20;0.22;0.97;1" dur="7s" repeatCount="indefinite"/></text>
  <text x="460" y="144" text-anchor="middle" font-size="11" font-weight="700" fill="#EF4444" opacity="0">Cracked!<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.20;0.23;0.97;1" dur="7s" repeatCount="indefinite"/></text>

  <!-- dlouhá fráze -->
  <rect x="168" y="168" width="330" height="88" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <rect x="182" y="180" width="192" height="22" rx="6" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
  <text x="278" y="195" text-anchor="middle" font-size="12" font-weight="700" fill="#1E1B4B">BlueCamelSingsOpera</text>
  <text x="384" y="195" font-size="11" fill="#6B7280">long phrase</text>
  <rect x="182" y="208" width="240" height="12" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="183" y="209" width="1" height="10" rx="2" fill="#10B981">
    <animate attributeName="width" values="1;1;3;5;7;7" keyTimes="0;0.06;0.35;0.65;0.95;1" dur="7s" repeatCount="indefinite"/>
  </rect>
  <text x="182" y="244" font-size="11" font-weight="700" fill="#10B981">trying and trying…<animate attributeName="opacity" values="1;0;1" keyTimes="0;0.21;0.97" calcMode="discrete" dur="7s" repeatCount="indefinite"/></text>
  <text x="182" y="244" font-size="11" font-weight="700" fill="#10B981" opacity="0">a year passed: nothing<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.21;0.46" calcMode="discrete" dur="7s" repeatCount="indefinite"/></text>
  <text x="182" y="244" font-size="11" font-weight="700" fill="#10B981" opacity="0">1,000 years passed: nothing<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.46;0.71" calcMode="discrete" dur="7s" repeatCount="indefinite"/></text>
  <text x="182" y="244" font-size="11" font-weight="700" fill="#10B981" opacity="0">1,000,000 years: still nothing<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.71;0.97" calcMode="discrete" dur="7s" repeatCount="indefinite"/></text>
  <text x="462" y="228" text-anchor="middle" font-size="18">🔒<animateTransform attributeName="transform" type="translate" values="0 0;1.6 0;-1.6 0;0 0" keyTimes="0;0.3;0.7;1" dur="0.5s" repeatCount="indefinite"/></text>
  <text x="462" y="248" text-anchor="middle" font-size="11" font-weight="700" fill="#10B981">Holds.</text>

  <text x="260" y="277" text-anchor="middle" font-size="11" fill="#6B7280">Every extra character multiplies the combinations: length beats complexity.</text>
</svg>
