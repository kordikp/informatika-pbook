  <text x="18" y="44" font-size="11" fill="#6B7280">Rozepsaný text je jen v operační paměti. Teprve uložením se dostane do úložiště.</text>
  <rect x="20" y="58" width="220" height="160" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="130" y="80" font-size="12" font-weight="700" fill="#1E1B4B" text-anchor="middle">operační paměť · 6 GB</text>
  <text x="130" y="96" font-size="10" fill="#6B7280" text-anchor="middle">rychlá, ale zapomíná</text>
  <rect x="36" y="108" width="188" height="26" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
  <text x="48" y="125" font-size="11" font-weight="600" fill="#1E1B4B">rozepsaný referát</text>
  <rect x="36" y="142" width="188" height="26" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
  <text x="48" y="159" font-size="11" font-weight="600" fill="#1E1B4B">rozehraná hra</text>
  <rect x="36" y="176" width="188" height="26" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
  <text x="48" y="193" font-size="11" font-weight="600" fill="#1E1B4B">otevřená stránka</text>
  <rect x="32" y="104" width="196" height="34" rx="8" fill="none" stroke="#EF4444" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="130" y="236" font-size="10" font-weight="700" fill="#EF4444" text-anchor="middle">⚡ mobil appku zavřel: referát je pryč</text>
  <rect x="300" y="58" width="200" height="160" rx="12" fill="#DCFCE7" stroke="#10B981" stroke-width="2"/>
  <text x="400" y="80" font-size="12" font-weight="700" fill="#1E1B4B" text-anchor="middle">úložiště · 128 GB</text>
  <text x="400" y="96" font-size="10" fill="#6B7280" text-anchor="middle">pamatuje trvale</text>
  <rect x="316" y="108" width="168" height="26" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="328" y="125" font-size="11" font-weight="600" fill="#1E1B4B">fotky</text>
