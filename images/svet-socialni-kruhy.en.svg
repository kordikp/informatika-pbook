<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" role="img" aria-label="Kdo vidí příspěvek: od „jen já“ po „veřejné“">
  <defs><marker id="a" viewBox="0 0 10 10" markerWidth="4.5" markerHeight="4.5" refX="7" refY="5" orient="auto"><path d="M0 1 L10 5 L0 9 L2 5 Z" fill="#7C3AED"/></marker><marker id="g" viewBox="0 0 10 10" markerWidth="4.5" markerHeight="4.5" refX="7" refY="5" orient="auto"><path d="M0 1 L10 5 L0 9 L2 5 Z" fill="#10B981"/></marker><marker id="r" viewBox="0 0 10 10" markerWidth="4.5" markerHeight="4.5" refX="7" refY="5" orient="auto"><path d="M0 1 L10 5 L0 9 L2 5 Z" fill="#EF4444"/></marker><marker id="s" viewBox="0 0 10 10" markerWidth="4.5" markerHeight="4.5" refX="7" refY="5" orient="auto"><path d="M0 1 L10 5 L0 9 L2 5 Z" fill="#9CA3AF"/></marker></defs>
  <rect x="1" y="1" width="518" height="258" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>
  <g font-family="system-ui, sans-serif">
  <text x="18" y="26" font-size="17" font-weight="700" fill="#1E1B4B">Who sees your post</text>
  <text x="18" y="44" font-size="11" fill="#6B7280">Privacy settings are circles. What has once got out, no setting brings back.</text>
  <circle cx="150" cy="150" r="100" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <circle cx="150" cy="150" r="76" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <circle cx="150" cy="150" r="52" fill="#DDD6FE" stroke="#7C3AED" stroke-width="2"/>
  <circle cx="150" cy="150" r="26" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="2"/>
  <text x="150" y="154" font-size="10" font-weight="700" fill="#1E1B4B" text-anchor="middle">only me</text>
  <text x="150" y="116" font-size="9" font-weight="700" fill="#1E1B4B" text-anchor="middle">close friends</text>
  <text x="150" y="90" font-size="9" font-weight="700" fill="#1E1B4B" text-anchor="middle">followers</text>
  <text x="150" y="64" font-size="9" font-weight="700" fill="#1E1B4B" text-anchor="middle">public</text>
  <text x="286" y="76" font-size="11" font-weight="700" fill="#1E1B4B">The bigger the circle, the less control.</text>
  <text x="286" y="100" font-size="10" font-weight="600" fill="#1E1B4B">party photo → close friends</text>
  <text x="286" y="120" font-size="10" font-weight="600" fill="#1E1B4B">club performance → followers</text>
  <text x="286" y="140" font-size="10" font-weight="600" fill="#EF4444">ticket with a QR code → no one</text>
  <rect x="282" y="168" width="214" height="60" rx="8" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
  <text x="294" y="188" font-size="11" font-weight="700" fill="#EF4444">“anyone with the link”</text>
  <text x="294" y="204" font-size="10" fill="#1E1B4B">the link can be forwarded to anyone</text>
  <text x="294" y="218" font-size="10" fill="#1E1B4B">and nothing stops a screenshot</text>
  <line x1="240" y1="190" x2="280" y2="196" stroke="#EF4444" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#r)"/>

  </g>
</svg>
