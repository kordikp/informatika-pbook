  <text x="83" y="110" font-size="10" font-weight="600" fill="#1E1B4B" text-anchor="middle">👟 ad</text>
  <line x1="83" y1="122" x2="216" y2="168" stroke="#D97706" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <rect x="158" y="60" width="110" height="74" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2"/>
  <text x="170" y="80" font-size="11" font-weight="700" fill="#1E1B4B">🎬 video</text>
  <rect x="170" y="90" width="86" height="32" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="213" y="110" font-size="10" font-weight="600" fill="#1E1B4B" text-anchor="middle">👟 ad</text>
  <line x1="213" y1="122" x2="246" y2="168" stroke="#D97706" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <rect x="288" y="60" width="110" height="74" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2"/>
  <text x="300" y="80" font-size="11" font-weight="700" fill="#1E1B4B">🎮 game</text>
  <rect x="300" y="90" width="86" height="32" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="343" y="110" font-size="10" font-weight="600" fill="#1E1B4B" text-anchor="middle">👟 ad</text>
  <line x1="343" y1="122" x2="276" y2="168" stroke="#D97706" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <rect x="176" y="170" width="150" height="40" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="251" y="187" font-size="11" font-weight="700" fill="#1E1B4B" text-anchor="middle">ad network</text>
