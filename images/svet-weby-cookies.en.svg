  <rect x="404" y="60" width="100" height="74" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="454" y="82" font-size="9" font-weight="700" fill="#1E1B4B" text-anchor="middle">your browser</text>
  <text x="454" y="104" font-size="18" fill="#1E1B4B" text-anchor="middle">🍪</text>
  <text x="454" y="124" font-size="10" font-weight="700" fill="#7C3AED" text-anchor="middle" font-family="ui-monospace, monospace">id: 7f3a</text>
  <line x1="404" y1="120" x2="330" y2="178" stroke="#7C3AED" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="416" y="192" font-size="10" font-weight="600" fill="#1E1B4B">the same cookie</text>
  <text x="416" y="206" font-size="10" font-weight="600" fill="#1E1B4B">on every website</text>
  <text x="260" y="240" font-size="10" fill="#6B7280" text-anchor="middle">The network pieces together where you have been and what interests you. It sells targeted ads from that.</text>

