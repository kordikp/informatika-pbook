<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" role="img" aria-label="Stejný formulář poslaný přes http a přes https">
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#7C3AED"/></marker><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#10B981"/></marker><marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#EF4444"/></marker><marker id="s" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#9CA3AF"/></marker></defs>
  <rect x="1" y="1" width="518" height="258" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>
  <g font-family="system-ui, sans-serif">
  <text x="18" y="26" font-size="17" font-weight="700" fill="#1E1B4B">Postcard or envelope</text>
  <text x="18" y="44" font-size="11" fill="#6B7280">Without encryption anyone on the way can read the form. With https they can’t.</text>
  <text x="24" y="92" font-size="13" font-weight="700" fill="#1E1B4B">http://</text>
  <rect x="120" y="66" width="150" height="50" rx="8" fill="#FFFFFF" stroke="#EF4444" stroke-width="2"/>
  <text x="195" y="86" font-size="9" fill="#6B7280" text-anchor="middle">form</text>
  <text x="195" y="104" font-size="12" font-weight="700" fill="#1E1B4B" text-anchor="middle" font-family="ui-monospace, monospace">password: pass123</text>
  <line x1="276" y1="91" x2="338" y2="91" stroke="#EF4444" stroke-width="2" marker-end="url(#r)"/>
  <text x="424" y="86" font-size="11" font-weight="600" fill="#1E1B4B" text-anchor="middle">👀 router and Wi-Fi</text>
  <text x="424" y="104" font-size="12" font-weight="700" fill="#EF4444" text-anchor="middle">anyone can read it</text>
  <text x="24" y="180" font-size="13" font-weight="700" fill="#1E1B4B">https:// 🔒</text>
  <rect x="120" y="154" width="150" height="50" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="195" y="174" font-size="9" fill="#6B7280" text-anchor="middle">form</text>
  <text x="195" y="192" font-size="12" font-weight="700" fill="#1E1B4B" text-anchor="middle" font-family="ui-monospace, monospace">x9Qf#2kL!p…</text>
  <line x1="276" y1="179" x2="338" y2="179" stroke="#10B981" stroke-width="2" marker-end="url(#g)"/>
  <text x="424" y="174" font-size="11" font-weight="600" fill="#1E1B4B" text-anchor="middle">👀 router and Wi-Fi</text>
  <text x="424" y="192" font-size="12" font-weight="700" fill="#10B981" text-anchor="middle">see only a jumble</text>
  <rect x="24" y="222" width="472" height="26" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="260" y="239" font-size="11" font-weight="600" fill="#1E1B4B" text-anchor="middle">The padlock protects the route. A scam site can have https too.</text>

  </g>
</svg>
