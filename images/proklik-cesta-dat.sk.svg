<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-label="Cesta fotky po balíčcích: rozdělení, různé cesty, výpadek routeru, objížďka a složení na serveru">
  <defs>
    <marker id="cdF" viewBox="0 0 10 10" markerWidth="3.2" markerHeight="3.2" refX="7" refY="5" orient="auto"><path d="M0 1 L10 5 L0 9 L2 5 Z" fill="#7C3AED"/></marker>
    <marker id="cdM" viewBox="0 0 10 10" markerWidth="3.2" markerHeight="3.2" refX="7" refY="5" orient="auto"><path d="M0 1 L10 5 L0 9 L2 5 Z" fill="#0284C7"/></marker>
  </defs>
  <rect x="1" y="1" width="518" height="298" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>
  <text x="18" y="26" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#1E1B4B">Cesta fotky po balíčkoch</text>
  <text x="18" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">Fotka sa rozdelí, balíčky idú rôznymi cestami a v cieli sa znova poskladajú.</text>

  <!-- síť: spoje -->
  <g stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M78 140 L159 99"/>
    <path d="M78 162 L159 205"/>
    <path d="M192 92 H318"/>
    <path d="M192 212 H318"/>
    <path d="M189 103 L321 201"/>
    <path d="M352 98 L438 136"/>
    <path d="M352 206 L438 166"/>
  </g>

  <!-- krok 2: dvě cesty -->
  <g data-krok="2" data-until="4" fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M78 140 L159 99 M192 92 H318 M352 98 L436 135" stroke="#7C3AED" marker-end="url(#cdF)"/>
  </g>
  <g data-krok="2" fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M78 162 L159 205 M192 212 H318 M352 206 L436 167" stroke="#0284C7" marker-end="url(#cdM)"/>
  </g>

  <!-- mobil -->
  <rect x="30" y="112" width="46" height="78" rx="8" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="2"/>
  <rect x="35" y="121" width="36" height="58" rx="3" fill="#FEF3C7"/>
  <text x="53" y="158" text-anchor="middle" font-size="22">🌅</text>
  <text x="53" y="208" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1E1B4B">Tvoj mobil</text>

  <!-- krok 1: fotka se rozpadne na 6 očíslovaných balíčků -->
  <g data-krok="1" data-until="3" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <rect x="36" y="122" width="16" height="17" rx="3" fill="#7C3AED"/><text x="44" y="134.5">1</text>
    <rect x="54" y="122" width="16" height="17" rx="3" fill="#7C3AED"/><text x="62" y="134.5">2</text>
    <rect x="36" y="141" width="16" height="17" rx="3" fill="#7C3AED"/><text x="44" y="153.5">3</text>
    <rect x="54" y="141" width="16" height="17" rx="3" fill="#0284C7"/><text x="62" y="153.5">4</text>
    <rect x="36" y="160" width="16" height="17" rx="3" fill="#0284C7"/><text x="44" y="172.5">5</text>
    <rect x="54" y="160" width="16" height="17" rx="3" fill="#0284C7"/><text x="62" y="172.5">6</text>
  </g>
  <g data-krok="1">
    <rect x="14" y="76" width="110" height="20" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="69" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#7C3AED">cieľ: 203.0.113.7</text>
  </g>

  <!-- routery -->
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <circle cx="175" cy="92" r="17" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
    <text x="175" y="97" font-size="14" font-weight="700" fill="#1E1B4B">A</text>
    <circle cx="175" cy="212" r="17" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
    <text x="175" y="217" font-size="14" font-weight="700" fill="#1E1B4B">B</text>
    <circle cx="335" cy="92" r="17" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
    <text x="335" y="97" font-size="14" font-weight="700" fill="#1E1B4B">C</text>
    <circle cx="335" cy="212" r="17" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
    <text x="335" y="217" font-size="14" font-weight="700" fill="#1E1B4B">D</text>
    <g font-size="10" fill="#6B7280">
      <text x="175" y="66">router</text>
      <text x="335" y="66">router</text>
      <text x="175" y="246">router</text>
      <text x="335" y="246">router</text>
    </g>
  </g>

  <!-- server -->
  <rect x="440" y="110" width="58" height="82" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <g stroke="#A5B4FC" stroke-width="2"><path d="M448 122 H490"/><path d="M448 130 H490"/></g>
  <text x="469" y="208" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1E1B4B">Server chatu</text>
  <text x="469" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#6B7280">203.0.113.7</text>

  <!-- krok 2: balíčky na cestě -->
  <g data-krok="2" data-until="4" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <rect x="110" y="111" width="16" height="17" rx="3" fill="#7C3AED"/><text x="118" y="123.5">1</text>
    <rect x="234" y="83" width="16" height="17" rx="3" fill="#7C3AED"/><text x="242" y="95.5">2</text>
    <rect x="262" y="83" width="16" height="17" rx="3" fill="#7C3AED"/><text x="270" y="95.5">3</text>
  </g>
  <g data-krok="2" data-until="4" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <rect x="110" y="175" width="16" height="17" rx="3" fill="#0284C7"/><text x="118" y="187.5">4</text>
    <rect x="234" y="203" width="16" height="17" rx="3" fill="#0284C7"/><text x="242" y="215.5">5</text>
    <rect x="386" y="178" width="16" height="17" rx="3" fill="#0284C7"/><text x="394" y="190.5">6</text>
  </g>

  <!-- krok 3: router A vypadne, objížďka přes B a D -->
  <g data-krok="3">
    <circle cx="175" cy="92" r="17" fill="#FEE2E2" stroke="#EF4444" stroke-width="2.5"/>
    <path d="M166 83 L184 101 M184 83 L166 101" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
    <text x="200" y="76" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#EF4444">výpadok</text>
  </g>
  <g data-krok="3" data-until="5">
    <text x="255" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0284C7">obchádzka</text>
    <g font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      <rect x="110" y="175" width="16" height="17" rx="3" fill="#7C3AED"/><text x="118" y="187.5">1</text>
      <rect x="226" y="203" width="16" height="17" rx="3" fill="#7C3AED"/><text x="234" y="215.5">2</text>
      <rect x="252" y="203" width="16" height="17" rx="3" fill="#7C3AED"/><text x="260" y="215.5">3</text>
    </g>
    <g font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      <rect x="452" y="140" width="16" height="17" rx="3" fill="#0284C7"/><text x="460" y="152.5">4</text>
      <rect x="470" y="140" width="16" height="17" rx="3" fill="#0284C7"/><text x="478" y="152.5">5</text>
      <rect x="452" y="159" width="16" height="17" rx="3" fill="#0284C7"/><text x="460" y="171.5">6</text>
    </g>
  </g>

  <!-- krok 4: server balíčky složí -->
  <g data-krok="4">
    <rect x="446" y="138" width="46" height="46" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="469" y="170" text-anchor="middle" font-size="24">🌅</text>
    <text x="469" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#10B981">✓ celá fotka</text>
  </g>

  <!-- popisek kroku -->
  <rect x="18" y="258" width="484" height="30" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <g font-family="system-ui, sans-serif" font-size="12" fill="#1E1B4B">
    <text x="30" y="278" data-until="2">Fotka má doraziť z mobilu na server chatu. Cestou ju odovzdávajú routery.</text>
    <text x="30" y="278" data-krok="1" data-until="3"><tspan font-weight="700">1 ·</tspan> Fotka sa rozdelí na 6 balíčkov. Každý nesie adresu cieľa.</text>
    <text x="30" y="278" data-krok="2" data-until="4"><tspan font-weight="700">2 ·</tspan> Balíčky idú rôznymi cestami: cez A a C, alebo cez B a D.</text>
    <text x="30" y="278" data-krok="3" data-until="5"><tspan font-weight="700">3 ·</tspan> Router A vypadne. Balíčky 1–3 idú obchádzkou cez B a D.</text>
    <text x="30" y="278" data-krok="4"><tspan font-weight="700">4 ·</tspan> Server poskladá balíčky podľa čísel. Fotka dorazila celá.</text>
  </g>
</svg>
