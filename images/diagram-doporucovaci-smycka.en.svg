<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 270" role="img" aria-label="Doporučovací smyčka: tvoje chování se stává signály, profilem a novým feedem">
  <defs>
    <marker id="sp" viewBox="0 0 10 10" markerWidth="4.5" markerHeight="4.5" refX="7" refY="5" orient="auto"><path d="M0 1 L10 5 L0 9 L2 5 Z" fill="#7C3AED"/></marker>
    <marker id="sg2" viewBox="0 0 10 10" markerWidth="4.5" markerHeight="4.5" refX="7" refY="5" orient="auto"><path d="M0 1 L10 5 L0 9 L2 5 Z" fill="#10B981"/></marker>
  </defs>
  <rect x="1" y="1" width="518" height="268" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>
  <text x="18" y="26" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#1E1B4B">Who fills your feed: the recommendation loop</text>
  <text x="18" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">Every action of yours teaches the system what to show you next.</text>

  <g font-family="system-ui, sans-serif">
    <!-- Ty -->
    <rect x="24" y="100" width="100" height="78" rx="11" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="2"/>
    <text x="74" y="130" text-anchor="middle" font-size="19">🧑</text>
    <text x="74" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#1E1B4B">You</text>
    <text x="74" y="166" text-anchor="middle" font-size="9.5" fill="#6B7280">watch · swipe</text>

    <!-- Signály -->
    <rect x="152" y="64" width="100" height="64" rx="11" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="202" y="88" text-anchor="middle" font-size="14">👣</text>
    <text x="202" y="105" text-anchor="middle" font-size="12" font-weight="700" fill="#1E1B4B">Signals</text>
    <text x="202" y="119" text-anchor="middle" font-size="9.5" fill="#6B7280">clicks, time, likes</text>

    <!-- Profil -->
    <rect x="280" y="64" width="100" height="64" rx="11" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <text x="330" y="88" text-anchor="middle" font-size="14">🗂</text>
    <text x="330" y="105" text-anchor="middle" font-size="12" font-weight="700" fill="#1E1B4B">Your profile</text>
    <text x="330" y="119" text-anchor="middle" font-size="9.5" fill="#6B7280">what you (maybe) like</text>

    <!-- Algoritmus -->
    <rect x="408" y="64" width="94" height="64" rx="11" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <text x="455" y="88" text-anchor="middle" font-size="14">⚙️</text>
    <text x="455" y="105" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1E1B4B">Algorithm</text>
    <text x="455" y="119" text-anchor="middle" font-size="9.5" fill="#6B7280">picks candidates</text>

    <!-- Feed -->
    <rect x="280" y="164" width="222" height="72" rx="11" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
    <text x="306" y="196" font-size="15">📱</text>
    <text x="336" y="192" font-size="12" font-weight="700" fill="#1E1B4B">Your feed</text>
    <text x="336" y="208" font-size="9.5" fill="#6B7280">looks totally different for a friend</text>
    <rect x="334" y="216" width="42" height="10" rx="3" fill="#FEF3C7"/>
    <rect x="382" y="216" width="42" height="10" rx="3" fill="#FEF3C7"/>
    <rect x="430" y="216" width="42" height="10" rx="3" fill="#FEF3C7"/>
  </g>

  <!-- šipky -->
  <path d="M124 122 C136 116 140 106 150 100" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#sg2)"/>
  <path d="M252 96 L277 96" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#sp)"/>
  <path d="M380 96 L405 96" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#sp)"/>
  <path d="M455 128 C455 142 440 152 420 162" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#sp)"/>
  <path d="M278 200 C180 200 110 190 92 180" fill="none" stroke="#0EA5E9" stroke-width="2" marker-end="url(#sg2)" stroke-dasharray="5 3"/>
  <text x="180" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#0EA5E9" font-weight="600">you keep scrolling, and teach it again</text>

  <text x="260" y="256" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#1E1B4B" font-weight="600">The loop's goal: hold your attention. Know it, and you can steer it: likes and “not interested”.</text>
</svg>
