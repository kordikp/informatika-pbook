<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 290" role="img" aria-label="Datový cyklus: sběr, čištění, analýza, vizualizace, interpretace">
  <defs>
    <marker id="cp" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#7C3AED"/></marker>
  </defs>
  <rect x="1" y="1" width="518" height="288" rx="14" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="2"/>
  <text x="18" y="26" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#1E1B4B">Datový cyklus: pět kroků</text>
  <text x="18" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">Přeskočený krok zkreslí všechno za ním.</text>

  <!-- kruh z pěti karet -->
  <g font-family="system-ui, sans-serif">
    <!-- 1 sběr (nahoře) -->
    <rect x="215" y="54" width="90" height="52" rx="9" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="260" y="76" text-anchor="middle" font-size="14">📋</text>
    <text x="260" y="94" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">1. Sběr</text>
    <!-- 2 čištění (vpravo nahoře) -->
    <rect x="360" y="98" width="98" height="52" rx="9" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="2"/>
    <text x="409" y="120" text-anchor="middle" font-size="14">🧹</text>
    <text x="409" y="138" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">2. Čištění</text>
    <!-- 3 analýza (vpravo dole) -->
    <rect x="322" y="196" width="98" height="52" rx="9" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <text x="371" y="218" text-anchor="middle" font-size="14">🔢</text>
    <text x="371" y="236" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">3. Analýza</text>
    <!-- 4 vizualizace (vlevo dole) -->
    <rect x="100" y="196" width="110" height="52" rx="9" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
    <text x="155" y="218" text-anchor="middle" font-size="14">📊</text>
    <text x="155" y="236" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">4. Vizualizace</text>
    <!-- 5 interpretace (vlevo nahoře) -->
    <rect x="58" y="98" width="112" height="52" rx="9" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="114" y="120" text-anchor="middle" font-size="14">💡</text>
    <text x="114" y="138" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">5. Interpretace</text>
  </g>

  <!-- šipky po směru -->
  <path d="M307 90 C340 92 360 96 380 98" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#cp)"/>
  <path d="M409 152 C405 170 395 182 385 194" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#cp)"/>
  <path d="M320 224 L214 224" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#cp)"/>
  <path d="M133 194 C122 180 116 168 114 154" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#cp)"/>
  <path d="M147 96 C170 88 190 84 212 82" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#cp)" stroke-dasharray="4 3"/>
  <text x="165" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#7C3AED">další otázka →</text>

  <!-- varování u čištění -->
  <rect x="428" y="160" width="80" height="30" rx="6" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="468" y="172" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#1E1B4B">přeskočíš →</text>
  <text x="468" y="183" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#1E1B4B">zkreslíš vše</text>

  <!-- střed -->
  <text x="253" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#6B7280">kolik spolužáci</text>
  <text x="253" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#6B7280">spí před písemkou?</text>

  <text x="260" y="274" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">Stejným cyklem prochází školní anketa i data pro trénink AI.</text>
</svg>
